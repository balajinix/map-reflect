"""noteevents contains all notes for patients."""
type mimic_NOTEEVENTS {
  "chartdate was included as time information is not always available for microbiology measurements."
  chartdate: String
  "date and time when the note was charted."
  charttime: String
  "category defines the type of note recorded."
  category: String
  "description defines the type of note recorded."
  description: String
  "flag to highlight an error with the note."
  iserror: String
  "content of the note."
  text: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  noteeventsList: [mimic_NOTEEVENTS]
  noteevents(id: ID!): mimic_NOTEEVENTS
}