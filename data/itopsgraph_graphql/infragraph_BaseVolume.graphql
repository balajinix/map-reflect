"""BaseVolume is a base type all volumes are expected to embed."""
type BaseVolume {
  base: Base!
  """the virtual machines this volume is attached to"""
  attached_virtual_machine_ids: [string]
  """size of the volume in GiB"""
  size: int32
  """input/output operations per second"""
  iops: int32
  """throghput in MB/s"""
  throughput: int32
  """flag indicating if the volume is encrypted"""
  is_encrypted: bool
}