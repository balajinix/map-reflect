"""Workspace is a type containing Terraform Workspace specific fields."""
type HcpTerraformWorkspace {
  base: Base!
  current_run_id: string
  resource_count: int32
  """the current state version id of the workspace"""
  current_state_version_id: string
  environment: string
  execution_mode: string
  tag_names: [string]
  agent_pool_id: string
}