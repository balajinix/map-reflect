}

type Restaurant_type {
  restaurant: [Restaurant]
    @materializer(query: "restaurantViaType_of_restaurant")
  restypedescription: String
  restypeid: ID!
  restypename: String
}

type Student {
  advisor: ID
  age: ID
  city_code: String
  fname: String
  lname: String
  major: ID
  sex: String
  stuid: ID!
  visits_restaurant: [Visits_restaurant]
    @materializer(query: "visits_restaurant")
}

type Visits_restaurant {
  resid: ID
  restaurant: Restaurant
    @materializer(query: "restaurantUsingVisits_restaurant_resid_fkey")
  spent: Float
  student: Student
    @materializer(query: "studentUsingVisits_restaurant_stuid_fkey")
  stuid: ID
  time: DateTime
}

