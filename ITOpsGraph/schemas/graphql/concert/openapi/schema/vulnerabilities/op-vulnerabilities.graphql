query GetVulnerabilities {
  vulnerabilities(
    page_size: 10
    page_number: 0
  ) {
    cves {
      cve
      exceptions_requested
      cvss
      highest_finding_risk_score
      description
      severity
      total_findings
      has_open_tickets
      open_tickets
      package_name
      package_version
      state
      ai_details
      ai_status
      related_cves
    }
  }
}
