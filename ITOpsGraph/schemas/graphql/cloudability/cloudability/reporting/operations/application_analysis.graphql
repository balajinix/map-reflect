query ApplicationAnalysis {
  llmFriendlyCostReport(
    dateRange: { start: "2024-01-01", end: "2024-01-31" }
    dimensions: [
      tagkey24
      tag24
      group_name3
      category16
      tagkey29
      tag29
      tagkey32
      tag32
      tagkey33
      tag33
      tagkey49
      tag49
    ]
    metrics: [unblended_cost]
    sort: [{ field: "unblended_cost", direction: DESC }]
    limit: 50
  ) {
    total_results
    results {
      tagkey24
      tag24
      group_name3
      category16
      tagkey29
      tag29
      tagkey32
      tag32
      tagkey33
      tag33
      tagkey49
      tag49
      unblended_cost
    }
  }
}
