type BuildArtifact {
  """Image ID"""
  id: String!
  """Name of the image"""
  name: String!
  """Image tag"""
  image_tag: String
  """Image digest"""
  digest: String
  """Image cyclonedx_link"""
  cyclonedx_link: String
  """Type of the artifact"""
  type: ArtifactType!
  """Version of library"""
  version: String
  """PURL of library"""
  purl: String
  """Filename of library"""
  file_name: String
  """URL of library"""
  url: String
  """Scope of library"""
  scope: String
  """Tags of the image"""
  tags: [TagsPrototype]!
  """Data impact risk of image"""
  data_impact_risk: Int
  """Image last updated time"""
  last_updated_on: Int
  """Image was last updated by"""
  last_updated_by: String
  """URI of the image"""
  uri: String
  """BOM reference link"""
  bom_ref: String
  """Associations of the build artifact"""
  associations: BuildArtifactAssociations
}