type turbo_StatsEntry {
  capacity: turbo_StatValue
  className: String
  commoditySource: turbo_CommoditySource
  displayName: String
  filters: [turbo_StatFilterEntry]
  histUtilizations: JSON
  name: String
  "Number of providers or consumers for this statistic, 'relatedEntity' and 'numRelatedEntities' are mutually exclusive"
  numRelatedEntities: Int
  relatedEntity: turbo_RelatedEntity
  relatedEntityType: String
  reserved: turbo_StatValue
  units: String
  uuid: ID
  value: Float
  values: turbo_StatValue
}

type turbo_Statistics {
  date: DateTime
  displayName: String
  epoch: String
  statistics: [turbo_StatsEntry]
}

input turbo_StatInput {
  "Used to get stats from different entity types in the supply chain of {uuid} E.G.costPrice of the VMs where the scope is a PM"
  relatedEntityType: String
  "Filters to apply to the requested stats."
  filters: [turbo_StatisticsFilterInput]
  "Execute a groupBy on the values of the stats. Commodities supported values: key, relatedEntity, virtualDisk. Cost Price supported values: cloudService, target, CSP, category, businessUnit, costComponent, costComponentArtifact. Please note that the costPrice stat is deprecated and will EOL in 8.12.1. Use the dedicated 'cost' endpoints in /entities, /groups and /markets instead.Action stats supported values: actionTypes, actionModes, actionStates, risk, riskSubCategory, riskSeverity"
  groupBy: [String]
  "Query the histUtilization table for these historyTypes Percentile or Smoothed"
  historyType: String
  "Name of the stat"
  name: String
}

input turbo_StatisticsFilterInput {
  displayName: String
  type: String
  value: String
}

type turbo_StatValue {
  avg: Float
  max: Float
  min: Float
  total: Float
  totalMax: Float
  totalMin: Float
}

type turbo_CommoditySource {
  capacityCommoditySource: String
  capacitySourceIndex: Int
}

type turbo_StatFilterEntry {
  displayName: String
  type: String
  value: String
}

type turbo_RelatedEntity {
  className: String
  displayName: String
  uuid: ID
}

type Query {
  turbo_entityStats(
    endDate: DateTime
    entity_uuid: ID!
    startDate: DateTime
    statistics: turbo_StatInput
  ): [turbo_Statistics]
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
