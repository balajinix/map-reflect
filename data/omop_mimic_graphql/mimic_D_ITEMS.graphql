"""d_items defines table for all items in the icu databases."""
type mimic_D_ITEMS {
  "itemid is a identifier for a single measurement type in the database."
  itemid: String
  "label describes the concept which is represented by the itemid."
  label: String
  "abbreviation lists a common abbreviation for the label."
  abbreviation: String
  "dbsource was generated to clarify which database the given itemid."
  dbsource: String
  "linksto provides the table name which the data links to."
  linksto: String
  "category provides some information of the type of data the itemid corresponds to."
  category: String
  "unitname specifies the unit of measurement used for the itemid."
  unitname: String
  "param_type describes the type of data which is recorded."
  param_type: String
  "identifier used to harmonize concepts identified by multiple itemids. conceptids are planned but not yet implemented."
  conceptid: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  d_itemsList: [mimic_D_ITEMS]
  d_items(id: ID!): mimic_D_ITEMS
}