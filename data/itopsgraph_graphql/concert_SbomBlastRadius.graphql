  """SBOM nodes"""
  sboms: [SbomBlastRadiusNodes]
  """Package nodes"""
  packages: [SbomBlastRadiusNodes]
  """Build artifact nodes"""
  build_artifacts: [SbomBlastRadiusNodes]
  """Repository nodes"""
  repositories: [SbomBlastRadiusNodes]
  """Application nodes"""
  applications: [SbomBlastRadiusNodes]
  """Environment nodes"""
  environments: [SbomBlastRadiusNodes]
  """Public access point nodes"""
  public_access_points: [SbomBlastRadiusNodes]
  """Private access point nodes"""
  private_access_points: [SbomBlastRadiusNodes]
}