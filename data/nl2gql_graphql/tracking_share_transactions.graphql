      query: "transactionsUsingTransactions_transaction_type_code_fkey"
    )
}

type Sales {
  sales_details: String
  sales_transaction_id: ID!
  transactions: Transactions
    @materializer(query: "transactionsUsingSales_sales_transaction_id_fkey")
}

type Transactions {
  amount_of_transaction: Float
  date_of_transaction: DateTime
  investor_id: ID
  investors: Investors
    @materializer(query: "investorsUsingTransactions_investor_id_fkey")
  lots: [Lots] @materializer(query: "lotsViaTransactions_lots")
