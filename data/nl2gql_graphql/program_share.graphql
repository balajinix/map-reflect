type Broadcast {
  channel: Channel @materializer(query: "channelUsingBroadcast_channel_id_fkey")
  channel_id: Int
  program: Program @materializer(query: "programUsingBroadcast_program_id_fkey")
  program_id: Int
  time_of_day: String
}

type Broadcast_share {
  channel: Channel @materializer(query: "channel")
  channel_id: Int
  date: String
  program: Program @materializer(query: "program")
  program_id: Int
  share_in_percent: Float
}

type Channel {
  broadcast: [Broadcast]
    @materializer(query: "broadcastUsingBroadcast_channel_id_fkey")
  broadcast_share: [Broadcast_share]
    @materializer(query: "broadcast_shareUsingBroadcast_share_channel_id_fkey")
  channel_id: Int
  name: String
  owner: String
  rating_in_percent: Float
  share_in_percent: Float
}

type Program {
  broadcast: [Broadcast] @materializer(query: "broadcast")
  broadcast_share: [Broadcast_share] @materializer(query: "broadcast_share")
  launch: Float
  name: String
  origin: String
  owner: String
  program_id: Int
}

