"""Most vulnerable application information"""
type MostVulnerableApplication {
  """Application ID"""
  id: String
  """Application name"""
  name: String
  """Count of priority 1 findings"""
  priority_1_findings: Int
  """Count of priority 2 findings"""
  priority_2_findings: Int
  """Count of priority 3 findings"""
  priority_3_findings: Int
}