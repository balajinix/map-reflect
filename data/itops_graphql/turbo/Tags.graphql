type Query {
  # Gets a list of available cost tag keys
  getCostTagKeys: [GetCostTagKey!]!

  # Gets a list of available tags
  getTags: [GetTag!]!

  # Retrieves all tag keys that exist in the topology for a given tag type
  getTagKeysByType(tagType: String!): [String!]!

  # Retrieves actions for a specific tag type and key
  getActionsForTag(tagKeyType: String!, tagKey: String!): GetActionForTag

  # Retrieves action stats grouped by tag value for a given tag type and tag key
  getActionStatsByTagTypeAndKey(tagKeyType: String!, tagKey: String!): [Stat!]!
}

# This `Query` type includes fields that map to the provided REST endpoints. The `getCostTagKeys` field retrieves a list of available cost tag keys, `getTags` fetches a list of available tags, `getTagKeysByType` returns all tag keys that exist in the topology for a given tag type, and `getActionsForTag` and `getActionStatsByTagTypeAndKey` provide actions for a specific tag type and key, and action stats grouped by tag value, respectively.

# The `tagType` and `tagKey` arguments are used in `getTagKeysByType`, `getActionsForTag`, and `getActionStatsByTagTypeAndKey` to filter the results based on the provided tag type and key. The `tagKeyType` argument is used in `getTagKeysByType` and `getActionsForTag` to specify the type of tag key.
