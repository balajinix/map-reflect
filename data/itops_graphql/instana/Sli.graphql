# """
# The Getsli type represents a well from the Sli domain.
# """
type Getsli {
  """
  The unique identifier for the well.
  """
  id: ID!

  """
  The name of the well.
  """
  name: String!

  """
  The location of the well.
  """
  location: String

  """
  The depth of the well.
  """
  depth: Int

  """
  The date the well was drilled.
  """
  drilledDate: String

  """
  The well's completion date.
  """
  completedDate: String

  """
  The well's production status.
  """
  productionStatus: String

  """
  The well's current production rate.
  """
  currentProductionRate: Float

  """
  The well's total production volume.
  """
  totalProductionVolume: Float

  """
  The well's reserves.
  """
  reserves: Float

  """
  The well's associated reservoirs.
  """
  reservoirs: [Reservoir!]!

  """
  The well's associated wellbores.
  """
  wellbores: [Wellbore!]!
}

# """
# The Reservoir type represents a reservoir from the Sli domain.
# """
type Reservoir {
  """
  The unique identifier for the reservoir.
  """
  id: ID!

  """
  The name of the reservoir.
  """
  name: String!

  """
  The formation type of the reservoir.
  """
  formationType: String

  """
  The reservoir's initial pressure.
  """
  initialPressure: Float

  """
  The reservoir's current pressure.
  """
  currentPressure: Float

  """
  The reservoir's temperature.
  """
  temperature: Float

  """
  The reservoir's fluid type.
  """
  fluidType: String

  """
  The reservoir's water cut.
  """
  waterCut: Float

  """
  The reservoir's oil saturation.
  """
  oilSaturation: Float

  """
  The reservoir's gas saturation.
  """
  gasSaturation: Float

  """
  The reservoir's associated wells.
  """
  wells: [Getsli!]!
}

# """
# The Wellbore type represents a wellbore from the Sli domain.
# """
type Wellbore {
  """
  The unique identifier for the wellbore.
  """
  id: ID!

  """
  The name of the wellbore.
  """
  name: String!

  """
  The wellbore's length.
  """
  length: Int

  """
  The wellbore's deviation survey.
  """
  deviationSurvey: String

  """
  The wellbore's inclination.
  """
  inclination: Float

  """
  The wellbore's azimuth.
  """
  azimuth: Float

  """
  The wellbore's associated well.
  """
  well: Getsli!
}

type Query {
  getsli(id: ID!): Getsli
  getsliByName(name: String!): Getsli
  getsliByLocation(location: String!): Getsli
  getsliByDrilledDate(drilledDate: String!): Getsli
  getsliByCompletedDate(completedDate: String!): Getsli
  getsliByProductionStatus(productionStatus: String!): Getsli
  getsliByReserves(reserves: Float!): Getsli
  getsliByTotalProductionVolume(totalProductionVolume: Float!): Getsli
  getsliByReservoirId(id: ID!): Getsli
  getsliByWellboreId(id: ID!): Getsli

  reservoir(id: ID!): Reservoir
  reservoirByFormationType(formationType: String!): Reservoir
  reservoirByInitialPressure(initialPressure: Float!): Reservoir
  reservoirByCurrentPressure(currentPressure: Float!): Reservoir
  reservoirByTemperature(temperature: Float!): Reservoir
  reservoirByFluidType(fluidType: String!): Reservoir
  reservoirByWaterCut(waterCut: Float!): Reservoir
  reservoirByOilSaturation(oilSaturation: Float!): Reservoir
  reservoirByGasSaturation(gasSaturation: Float!): Reservoir
  reservoirByWellId(id: ID!): Reservoir

  wellbore(id: ID!): Wellbore
  wellboreByWellId(id: ID!): Wellbore
}

