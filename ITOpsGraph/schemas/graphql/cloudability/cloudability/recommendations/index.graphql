type AggregatesEntry {
  basis: String
  cost: Float
  idleSavings: Float
  optimizedSavings: Float
  rightsizeSavings: Float
}

type RecommendationMeta {
  aggregates: [AggregatesEntry]
  info: [JSON]
  totalCount: Int
}

type RecommendationsEC2 {
  meta: RecommendationMeta
  result: [RecommendationResultEntry]
}

type RecommendationsEntry {
  action: String
  cpuCapacity: Float
  cpuRatio: Float
  cpuRisk: Float
  currentGen: Boolean
  defaultsOrder: Int
  diskRisk: Int
  diskXPutCapacity: Int
  gpuCapacity: Int
  gpuMemoryCapacity: Int
  gpuMemoryRatio: Int
  gpuRatio: Int
  inDefaults: Boolean
  instanceFamily: String
  localCapacity: Int
  localDrives: Int
  maxInstances: Int
  memoryCapacity: Float
  memoryFit: Boolean
  memoryRatio: Int
  memoryRisk: Int
  minInstances: Int
  networkCapacity: Int
  networkRatio: Float
  networkRisk: Int
  nodeType: String
  persistentStorageAdded: Boolean
  preferenceOrder: Int
  previousGenTarget: Boolean
  risk: Int
  sameFamily: Boolean
  sameMemory: Boolean
  savings: Float
  savingsPct: Int
  unitPrice: Float
}

type RecommendationResultEntry {
  accountName: String
  availabilityZone: String
  cpuCapacity: Float
  cpuMax: Int
  currencyCode: String
  daysInactive: Int
  defaultCrossArchitecture: Boolean
  defaultCurrentGen: Boolean
  defaultMemoryFit: Boolean
  defaultSameFamily: Boolean
  gpuCapacity: Int
  gpuMax: String
  gpuMemoryCapacity: Int
  gpuMemoryMax: String
  hoursRunning: Float
  idle: Int
  instanceFamily: String
  lastSeen: DateTime
  localCapacity: Int
  localDrives: Int
  maxInstanceCount: Int
  memoryCapacity: Float
  memoryMax: String
  minInstanceCount: Int
  name: String
  networkCapacity: Int
  nodeType: String
  os: String
  provider: String
  recommendations: [RecommendationsEntry]
  region: String
  resourceIdentifier: String
  service: String
  snoozeExpiresOn: String
  snoozed: Boolean
  tagMappings: [TagMappingsEntry]
  tenancy: String
  totalSpend: Float
  unitPrice: Float
  vendorAccountId: Float
}

type TagMappingsEntry {
  tag: String
  tagName: String
  vendorTagValue: String
}

type Query {
  recommendationsEC2: RecommendationsEC2
    @rest(
      endpoint: "https://$hostname;/v3/rightsizing/aws/recommendations/ec2"
      method: GET
      headers: [
        { name: "accept", value: "application/json" }
        { name: "authorization", value: "Basic $apitoken;"}
      ]
      configuration: "apptio-guard"
    )
}
