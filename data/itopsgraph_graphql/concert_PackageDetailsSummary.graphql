type PackageDetailsSummary {
  """Package ID"""
  id: String
  """Name of the package"""
  name: String!
  """License of the package"""
  licenses: [LicenseStatus]!
  """License status of the package"""
  license_status: String
  """Version of the package"""
  version: String!
  """Source URL of the package"""
  source_url: String
  """Registry / ecosystem of package"""
  registry: String
  """Tags of the package"""
  tags: [String]!
  """Package last updated time"""
  last_updated_on: Int
  """Package last updated by"""
  last_updated_by: String
  """Package was published at"""
  published_at: String
  """Backlevel of package"""
  backlevel: String!
  """Default version of package"""
  default_version: String
  """Package default published at"""
  default_published_at: String
  """Latest version of package"""
  latest_version: String
  """Package latest published at"""
  latest_published_at: String
  """ossrepo of package"""
  ossrepo: String
  """Stat of package"""
  stat: String
  """Score of package"""
  avg_score: Float
  """Score of package"""
  min_score: Int
  """Description of package"""
  description: String
  """Vulnerability count of package"""
  vulnerability_count: Int!
  """Array of CVEs for a package"""
  cves: [CveInfo]!
  """Check level info for a package"""
  checks: [Checks]!
  """References"""
  references: PackageReferences!
  """Recommendation"""
  recommendation: PackageRecommendation!
}