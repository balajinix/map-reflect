type Link {
  rel: String!
  href: String!
  hreflang: String
  media: String
  title: String
  type: String
  deprecation: String
  profile: String
  name: String
}

type Owner {
  links: [Link!]!
  uuid: String!
  displayName: String!
  className: String
  username: String
  password: String
  roles: String
  loginProvider: String
  type: String
  scope: String
  atdScope: String
  features: String
  authToken: String
  showSharedUserSC: String
}

