      ]
      configuration: "ibmConcert"
    )

  """
  Get all applications filters
  """
  applicationFilters(
    """
    Authorization token
    """
    token: Secret
  ): ApplicationFilters
    @rest(
      endpoint: "https://$hostname/core/api/v1/application_filters"
