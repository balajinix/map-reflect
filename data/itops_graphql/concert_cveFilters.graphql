type concert_ApplicationDetails {
  "Application ID"
  application_id: String
  "Release versions"
  release_version: [String]
}

type concert_CVEFilters {
  "Application filters"
  application: [concert_ApplicationDetails]
  "Exception requested filters"
  has_exceptions_requested: [Boolean]
  "Open tickets filters"
  has_open_tickets: [Boolean]
  "Unassessed findings filters"
  has_unassessed_findings: [Boolean]
  "Priority filters"
  highest_finding_priority: [String]
  "Scan type filters"
  scan_type: [String]
}

