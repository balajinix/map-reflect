"""Pulsar job metadata"""
type AppJob {
  """customer id of the job owner"""
  customer: Int
  """job appid"""
  appid: ID
  """app job id"""
  jobid: ID
  """descriptive name"""
  name: String
  typeid: JobTypeID
  """job is active and usable for routing"""
  active: Boolean
  """measurements and data publically available"""
  community: Boolean
  """visible and usuable by to other customers"""
  shared: Boolean
  """details about the job configuration"""
  config: JobConfig
}