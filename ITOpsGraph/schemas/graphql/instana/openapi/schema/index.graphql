"""
Instana API for Solis-DAL.

*Experiment - subject to change*
"""
schema
  @sdl(
    files: [
      "applications/atom.graphql"
      "infrastructure/atom.graphql"
      "common.graphql"
    ]
    visibility: { expose: true, types: "Query|Mutation", fields: "[^_].*" }
  ) {
  query: Query
  mutation: Mutation
}
