type apptio_AggregatesEntry {
  basis: String
  cost: Float
  idleSavings: Float
  optimizedSavings: Float
  rightsizeSavings: Float
}

type apptio_RecommendationMeta {
  aggregates: [apptio_AggregatesEntry]
  info: [JSON]
  totalCount: Int
}

type apptio_RecommendationsEC2 {
  meta: apptio_RecommendationMeta
  result: [apptio_RecommendationResultEntry]
}

type apptio_RecommendationResultEntry {
  accountName: String
  availabilityZone: String
  cpuCapacity: Float
  cpuMax: Int
  currencyCode: String
  daysInactive: Int
  defaultCrossArchitecture: Boolean
  defaultCurrentGen: Boolean
  defaultMemoryFit: Boolean
  defaultSameFamily: Boolean
  gpuCapacity: Int
  gpuMax: String
  gpuMemoryCapacity: Int
  gpuMemoryMax: String
  hoursRunning: Float
  idle: Int
  instanceFamily: String
  lastSeen: DateTime
  localCapacity: Int
  localDrives: Int
  maxInstanceCount: Int
  memoryCapacity: Float
  memoryMax: String
  minInstanceCount: Int
  name: String
  networkCapacity: Int
  nodeType: String
  os: String
  provider: String
  recommendations: [apptio_RecommendationsEntry]
  region: String
  resourceIdentifier: String
  service: String
  snoozeExpiresOn: String
  snoozed: Boolean
  tagMappings: [apptio_TagMappingsEntry]
  tenancy: String
  totalSpend: Float
  unitPrice: Float
  vendorAccountId: Float
}

type apptio_RecommendationsEntry {
  action: String
  cpuCapacity: Float
  cpuRatio: Float
  cpuRisk: Float
  currentGen: Boolean
  defaultsOrder: Int
  diskRisk: Int
  diskXPutCapacity: Int
  gpuCapacity: Int
  gpuMemoryCapacity: Int
  gpuMemoryRatio: Int
  gpuRatio: Int
  inDefaults: Boolean
