"""the admissions table gives information regarding a patient’s admission to the hospital."""
type mimic_ADMISSIONS {
  "a unique id for all mimic tables."
  mimic_id: String
  "hadm_id represents a single patient’s admission to the hospital."
  hadm_id: String
  "admittime provides the date and time the patient was admitted to the hospital."
  admittime: String
  "dischtime provides the date and time the patient was discharged from the hospital."
  dischtime: String
  "deathtime provides the time of in-hospital death for the patient."
  deathtime: String
  "admission_type describes the type of the admission."
  admission_type: String
  "admission_location provides information about the previous location of the patient prior to arriving at the hospital."
  admission_location: String
  "insurance describes patient demographics."
  insurance: String
  "language describes patient demographics."
  language: String
  "religion describes patient demographics."
  religion: String
  "marital_status describes patient demographics."
  marital_status: String
  "ethnicity describes patient demographics."
  ethnicity: String
  "edregtime describes time that the patient was registered"
  edregtime: String
  "edouttime describes time that the patient was registered"
  edouttime: String
  "diafnosis provides a preliminary, free text diagnosis for the patient on hospital admission."
  diagnosis: String
  "hospital_expire_flag indicates whether the patient died within the given hospitalization."
  hospital_expire_flag: String
}

type Query {
  admissionsList: [mimic_ADMISSIONS]
  admissions(id: ID!): mimic_ADMISSIONS
}