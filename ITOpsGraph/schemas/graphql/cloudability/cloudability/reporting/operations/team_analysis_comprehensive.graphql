query TeamAnalysisComprehensive {
  llmFriendlyCostReport(
    dateRange: { start: "2024-01-01", end: "2024-01-31" }
    dimensions: [
      category24
      category7
      tag2
      tag21
      tag27
      tagkey2
      tagkey21
      tagkey27
    ]
    metrics: [unblended_cost]
    sort: [{ field: "unblended_cost", direction: DESC }]
    limit: 100
  ) {
    total_results
    results {
      category24
      category7
      tag2
      tag21
      tag27
      tagkey2
      tagkey21
      tagkey27
      unblended_cost
    }
  }
}
