  "line nch payment amount 1 – line nch payment amount 13"
  line_nch_pmt_amt: String
  "line beneficiary part b deductible amount 1 – line beneficiary part b deductible amount 13"
  line_bene_ptb_ddctbl_amt: String
  "line beneficiary primary payer paid amount 1 – line beneficiary primary payer paid amount 13"
  line_bene_prmry_pyr_pd_amt: String
