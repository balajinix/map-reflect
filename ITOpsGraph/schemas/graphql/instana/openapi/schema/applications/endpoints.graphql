extend type Query {
  """
  Fetches endpoints for a given application and service identifier.

  https://instana.github.io/openapi/#operation/getApplicationEndpoints
  """
  _instana_getApplicationEndpoints(
    first: Int! = 10
    after: String! = ""
    id: ID!
    _to: String!
    _windowSize: String!
    _appid: ID!
  ): [ServiceEndpoint]
    @rest(
      endpoint: "https://$hostname;/api/application-monitoring/applications;id=$_appid;/services;id=$id;/endpoints?page=1&pageSize=$first;&to=$_to;&windowSize=$_windowSize;"
      method: GET
      headers: [{ name: "authorization", value: "apitoken $apitoken;" }]
      setters: [
        { field: "entityType", path: "items[].entityType" }
        { field: "id", path: "items[].id" }
        { field: "label", path: "items[].label" }
        { field: "technologies", path: "items[].technologies" }
        { field: "type", path: "items[].type" }
        { field: "syntheticType", path: "items[].syntheticType" }
      ]
      configuration: "instana"
    )
}

"""
Service endpoint.
"""
type ServiceEndpoint implements Entity {
  entityType: EntityType

  """
  Unique ID of the endpoint.
  """
  id: ID!

  """
  Name of the endpoint. Eg: payment.
  """
  label: String!

  syntheticType: SyntheticType

  """
  List of technologies: Eg: `["springbootApplicationContainer"]`
  """
  technologies: [String]!

  """
  Types of the endpoint.
  """
  type: ServiceType!
}

enum SyntheticType {
  NON_SYNTHETIC
  SYNTHETIC
  MIXED
}

extend type ApplicationService {
  """
  Endpoints.
  """
  endpoints: [ServiceEndpoint]
    @materializer(query: "_instana_getApplicationEndpoints")
}
