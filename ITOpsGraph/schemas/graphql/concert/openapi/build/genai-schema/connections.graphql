schema {
  query: Query
  mutation: Mutation
}

"""
Root Query type that provides read operations for the IBM Concert Connections API.
"""
type Query {
  """
  Returns a list of all established connections with tools and services.
  """
  credentials(
    """Optional filter by credential name."""
    name: String
  ): IngestionJobCredentialCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/credentials"
      method: GET
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )

  """
  Returns details about a specific connection by its unique credential ID.
  """
  credential(
    """The unique ID of the credential to retrieve."""
    credentialId: String!
  ): IngestionJobCredential
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/credentials/$credentialId"
      method: GET
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )
}

"""
Root Mutation type that provides write operations for the IBM Concert Connections API.
"""
type Mutation {
  """
  Establishes a connection between Concert and a tool or service.
  """
  createCredential(
    """Name of the connection."""
    name: String!
    """Configuration details for the connection."""
    config: JSON
  ): IngestionJobCredential
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/credentials"
      method: POST
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      contenttype: "application/json"
      configuration: "ibmConcert"
    )

  """
  Modifies the configuration details for an established connection.
  """
  updateCredential(
    """The unique ID of the credential to update."""
    credentialId: String!
    """Updated configuration details for the connection."""
    config: JSON
  ): IngestionJobCredential
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/credentials/$credentialId"
      method: PATCH
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      contenttype: "application/merge-patch+json"
      configuration: "ibmConcert"
    )

  """
  Removes the credentials and configuration details for one or more connections.
  """
  deleteCredentials(
    """Comma separated list of credential IDs to be deleted."""
    deleteIds: String!
  ): Boolean
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/credentials"
      method: DELETE
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      arguments: [
        { name: "delete_ids", argument: "deleteIds" }
      ]
      configuration: "ibmConcert"
    )
}

"""
Collection of connection credentials
"""
type IngestionJobCredentialCollection {
  """List of credentials"""
  credentials: [IngestionJobCredential]
}

"""
Details of a connection credential
"""
type IngestionJobCredential {
  """Unique identifier of the credential"""
  id: String
  
  """Name of the credential"""
  name: String
  
  """Configuration details of the credential"""
  config: JSON
}

"""
Error response object
"""
type ErrorResponse {
  """Error message"""
  error: String
}

