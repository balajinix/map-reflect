"""the callout table provides information about icu discharge planning."""
type mimic_CALLOUT {
  "submit_wardid identifies the ward from which the request was submitted."
  submit_wardid: String
  "submit_careunit indicates whether the submit_wardid corresponds to an icu cost center, and if so, what type of icu cost center."
  submit_careunit: String
  "curr_wardid identifies the ward in which the patient resides when called out."
  curr_wardid: String
  "curr_careunit indicates which icu cost center the curr_wardidcorresponds to."
  curr_careunit: String
  "callout_wardid identifies the ward to which the patient should be discharged."
  callout_wardid: String
  "callout_service is the service under which the patient should be discharged."
  callout_service: String
  "request_tele requests certain precautions for the patient in the subsequent ward where they will reside."
  request_tele: String
  "request_resp requests certain precautions for the patient in the subsequent ward where they will reside."
  request_resp: String
  "request_cdiff requests certain precautions for the patient in the subsequent ward where they will reside."
  request_cdiff: String
  "request_mrsa requests certain precautions for the patient in the subsequent ward where they will reside."
  request_mrsa: String
  "request_vre requests certain precautions for the patient in the subsequent ward where they will reside."
  request_vre: String
  "callout_status indicates whether the call out is still active or not."
  callout_status: String
  "callout_outcome indicates whether the patient finally called out"
  callout_outcome: String
  "discharge_wardid indicates the ward to which the patient was actually discharged."
  discharge_wardid: String
  "acknowledge_status indicates the response to the callout event."
  acknowledge_status: String
  "createtime provides the time and date that the call out was initiated."
  createtime: String
  "updatetime provides the last time at which the call out event was updated."
  updatetime: String
  "acknowledgetime is the time at which the call out was first acknowledged."
  acknowledgetime: String
  "outcometime is the time at which the callout_outcome occurred."
  outcometime: String
  "firstreservationtime provides information regarding ward reservations."
  firstreservationtime: String
  "currentreservationtime provides information regarding ward reservations."
  currentreservationtime: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  calloutList: [mimic_CALLOUT]
  callout(id: ID!): mimic_CALLOUT
}