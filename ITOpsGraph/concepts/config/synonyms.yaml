# Cross-product synonym dictionary for ITOps entities
#
# Maps product-specific terminology to canonical forms.
# Used by the entity resolution module to deduplicate entities
# that refer to the same concept but use different names.

cross_product_synonyms:
  # Infrastructure Resources
  virtual_machine:
    canonical: "Virtual Machine"
    aliases:
      - "VM"
      - "EC2 Instance"          # AWS
      - "Compute Instance"      # GCP
      - "Azure VM"              # Azure
      - "Virtual Server"        # Generic
      - "vServer"               # IBM
      - "Guest VM"

  container:
    canonical: "Container"
    aliases:
      - "Docker Container"
      - "Container Instance"    # AWS ECS
      - "Linux Container"
      - "OCI Container"

  pod:
    canonical: "Pod"
    aliases:
      - "Kubernetes Pod"
      - "K8s Pod"
      - "K8S Pod"

  node:
    canonical: "Node"
    aliases:
      - "Worker Node"
      - "Kubernetes Node"
      - "K8s Node"
      - "Compute Node"
      - "Cluster Node"

  cluster:
    canonical: "Cluster"
    aliases:
      - "Compute Cluster"
      - "Server Cluster"
      - "Node Cluster"

  kubernetes_cluster:
    canonical: "Kubernetes Cluster"
    aliases:
      - "K8s Cluster"
      - "K8S Cluster"
      - "Kube Cluster"
      - "EKS Cluster"           # AWS
      - "GKE Cluster"           # GCP
      - "AKS Cluster"           # Azure

  namespace:
    canonical: "Namespace"
    aliases:
      - "K8s Namespace"
      - "Kubernetes Namespace"
      - "NS"

  # Kubernetes Platform
  kubernetes:
    canonical: "Kubernetes"
    aliases:
      - "K8s"
      - "K8S"
      - "Kube"

  # Networking
  load_balancer:
    canonical: "Load Balancer"
    aliases:
      - "ELB"                   # AWS Elastic Load Balancer
      - "ALB"                   # AWS Application Load Balancer
      - "NLB"                   # AWS Network Load Balancer
      - "Azure Load Balancer"
      - "Cloud Load Balancing"  # GCP
      - "LB"

  network:
    canonical: "Network"
    aliases:
      - "VPC"                   # AWS/GCP
      - "VNET"                  # Azure
      - "Virtual Network"
      - "Networking"

  subnet:
    canonical: "Subnet"
    aliases:
      - "Subnetwork"
      - "Network Subnet"

  security_group:
    canonical: "Security Group"
    aliases:
      - "SG"
      - "NSG"                   # Azure Network Security Group
      - "Firewall Rules"

  # Storage
  storage:
    canonical: "Storage"
    aliases:
      - "Disk"
      - "Volume"
      - "Block Storage"
      - "Persistent Storage"

  volume:
    canonical: "Volume"
    aliases:
      - "EBS"                   # AWS
      - "Persistent Volume"
      - "PV"
      - "Block Volume"

  # Database
  database:
    canonical: "Database"
    aliases:
      - "DB"
      - "RDS"                   # AWS
      - "Cloud SQL"             # GCP
      - "Azure SQL"
      - "Database Instance"

  # Compute Resources
  cpu:
    canonical: "CPU"
    aliases:
      - "Processor"
      - "vCPU"
      - "CPU Usage"
      - "CPU Utilization"
      - "Compute"

  memory:
    canonical: "Memory"
    aliases:
      - "RAM"
      - "Memory Usage"
      - "Memory Utilization"
      - "Mem"

  # Scaling
  auto_scaling:
    canonical: "Auto Scaling"
    aliases:
      - "Autoscaling"
      - "Auto-scaling"
      - "Auto Scale"
      - "Autoscaler"
