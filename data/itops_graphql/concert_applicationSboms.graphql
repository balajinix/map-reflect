enum concert_SortDirection {
  "Sort in ascending order"
  asc
  "Sort in descending order"
  desc
}

type concert_ApplicationSbomsCollection {
  "ConcertDef sbom"
  sboms: [concert_ConcertDefSbom!]!
}

type concert_ConcertDefSbom {
  "El link"
  el_link: String
  "Path of the SBOM file"
  el_path: String
  "Name of the SBOM file"
  file_name: String
  "ID of the sbom"
  id: String
  "Last updated by"
  last_updated_by: String
  "Last updated on"
  last_updated_on: Int
  "Tags of the concertdef_sbom"
  tags: [String!]!
  "Timestamp"
  timestamp: Int
  "Type of the sbom"
  type: String
}

type Query {
  concert_applicationSboms(
    application_id: String!
    page_number: Int
    page_size: Int
    release_version: String
    search: String
    sort_by: String
    sort_direction: concert_SortDirection
    token: Secret
  ): concert_ApplicationSbomsCollection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
