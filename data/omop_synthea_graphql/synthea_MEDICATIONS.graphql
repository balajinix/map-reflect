"""patient medication data."""
type synthea_MEDICATIONS {
  "the date the medication was prescribed."
  start: String
  "the date the prescription ended, if applicable."
  stop: String
  "foreign key to the patient."
  patient: String
  "foreign key to the encounter where the medication was prescribed."
  encounter: String
  "medication code from rxnorm."
  code: String
  "description of the medication."
  description: String
  "the line item cost of the medication."
  cost: String
  "diagnosis code from snomed-ct specifying why this medication was prescribed."
  reasoncode: String
  "description of the reason code."
  reasondescription: String
}

type Query {
  medicationsList: [synthea_MEDICATIONS]
  medications(id: ID!): synthea_MEDICATIONS
}