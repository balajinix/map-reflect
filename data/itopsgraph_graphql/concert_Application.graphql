type Application {
  """ID of the application"""
  id: String!
  """Name of the application"""
  name: String!
  """Current state of the application"""
  latest: Boolean!
  """Status of the application"""
  status: String
  """Role of the auth user for the application"""
  auth_user_role: String
  """The version of the application"""
  version: String
  """The tags of the application"""
  tags: [TagsPrototype]!
  """The description of the application"""
  description: String
  """The application created time"""
  created_on: Int
  """The last updated time of the application"""
  last_updated_on: Int
  """Application last updated by"""
  last_updated_by: String
  """Application last modified by"""
  last_modified_by: String
  """The criticality of the application"""
  criticality: Int!
  """Data impact risk of the application"""
  data_impact_risk: Int!
  """Business name of application"""
  business_name: String
  """Application revenue per hour"""
  revenue_per_hour: Float
  """Array of units of a business"""
  business_units: [String]!
  """Business id of application"""
  business_id: String
  """Application belongs to sample data"""
  sample: Boolean!
  """The resilience is enabled / disabled on the application"""
  resilience_status: String
  """Application release properties"""
  properties: ApplicationReleaseProperties!
  """Application associations"""
  associations: ApplicationAssociationsInfo
}