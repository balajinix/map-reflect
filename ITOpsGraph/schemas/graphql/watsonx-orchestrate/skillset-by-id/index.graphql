type SkillSetByID {
  skills: [JSON]
}

type Query {
  skillSetById: SkillSetByID
    @rest(
      endpoint: "https://$hostname;/instances/$tenant-id;/v1/skillsets/$skillset-id;"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo"
    )
}
