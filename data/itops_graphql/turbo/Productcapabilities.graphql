# """
# Represents the capabilities of a product.
# """
type ProductCapabilities {
  """
  The deployment mode, which affects hiding/showing multiple UI views.
  """
  deploymentMode: String!

  """
  Controls the use of the new search api.
  """
  searchApiEnabled: String!

  """
  Controls hiding/showing parking related pages in the UI.
  """
  parkingEnabled: String!

  """
  Controls enabling/disabling front end telemetry in the UI.
  """
  frontEndTelemetryEnabled: String!

  """
  Controls the use of JDBC persistent HTTP Session.
  """
  jdbcHttpSessionEnabled: String!

  """
  Controls hiding/showing the SaaS reports page in the UI.
  """
  saasReportingEnabled: String!

  """
  Controls hiding/showing the reporting page in the UI.
  """
  reportingEnabled: String!
}

type Query {
  productCapabilities(id: ID!): ProductCapabilities @rest(table: "Getproductcapabilities")
}

# This `Query` type defines a single field `productCapabilities` that takes an `id` argument. This field is decorated with the `@rest` directive, specifying the REST endpoint to use for fetching data, which is "Getproductcapabilities" in this case. The returned data type is `ProductCapabilities`, which maps to the fields defined in the provided schema.
