  /applications/{application_id}/revenue:
    get:
      description: Get application revenue per hour
      operationId: get_application_revenue
      parameters:
        - description: Instance ID
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: This can be either the application name or the unique UUID of the application definition.
          in: path
          name: application_id
          required: true
          schema:
            example: a11ddc39-b678-4af9-bca2-c022dd4206a3
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: release version of the application
          in: query
          name: release_version
          schema:
            example: '1.0'
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-_.]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReleaseProperties'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Get application revenue per hour
      tags:
        - Application definitions
      x-ibm-events:
        description: AMS level 2 API execution event
        event:
          - name: coreapi.application.revenue.get
          - description: Get API call to fetch the application revenue
      x-ibm-permissions:
        actions:
          - name: coreapi.application.revenue.get
  /applications/{application_id}/sboms:
    get:
      description: Get sboms of an application
