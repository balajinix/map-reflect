type BaseLlm {
  guardrails: Guardrails
  model_name: String
  model_params: ModelParams
  system_prompt: String
}

type DefaultAgentSettings {
  model_settings: ModelSettings
  router_settings: RouterSettings
  slot_filling_settings: SlotFillingSettings
  user_settings: UserSettings
}

type Embeddings {
  model_name: String
}

type Guardrails {
  hap: Hap
  pii: Pii
}

type Hap {
  input: Input
  output: Output
}

type Input {
  enabled: Boolean
  threshold: Float
}

type Input1 {
  enabled: Boolean
  threshold: Float
}

type Mask {
  remove_entity_value: Boolean
}

type ModelParams {
  decoding_method: String
  max_new_tokens: Int
  min_new_tokens: Int
  random_seed: Int
  temperature: Float
}

type ModelParams1 {
  decoding_method: String
  max_new_tokens: Int
  min_new_tokens: Int
  random_seed: Int
  repetition_penalty: Int
  return_options: ReturnOptions
  temperature: Float
  top_k: Int
  top_p: Int
}

type ModelParams2 {
  decoding_method: String
  max_new_tokens: Int
  min_new_tokens: Int
  random_seed: Int
  repetition_penalty: Int
  return_options: ReturnOptions1
  temperature: Float
  top_k: Int
  top_p: Int
}

type ModelSettings {
  base_llm: BaseLlm
  embeddings: Embeddings
  is_base_llm_enabled: Boolean
}

type Output {
  enabled: Boolean
  threshold: Float
}

type Output1 {
  enabled: Boolean
  threshold: Float
}

type Pii {
  input: Input1
  mask: Mask
  output: Output1
}

type ReturnOptions {
  generated_tokens: Boolean
  input_text: Boolean
  input_tokens: Boolean
  token_logprobs: Boolean
  token_ranks: Boolean
  top_n_tokens: Int
}

type ReturnOptions1 {
  generated_tokens: Boolean
  input_text: Boolean
  input_tokens: Boolean
  token_logprobs: Boolean
  token_ranks: Boolean
  top_n_tokens: Int
}

type RouterConfig {
  confidence_method: String
  confidence_threshold: Float
  continue_journey_on_none: Boolean
}

type RouterSettings {
  model_name: String
  model_params: ModelParams1
  router_config: RouterConfig
  router_type: String
  routing_prompt: String
}

type SlotFillingSettings {
  model_name: String
  model_params: ModelParams2
  slot_filler_type: String
}

type UserSettings {
  confirm_routing: Boolean
}

type Query {
  defaultAgentSettings: DefaultAgentSettings
    @rest(
      endpoint: "https://$hostname;/instances/$tenant-id;/v1/orchestrate/default-agent-settings"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo"
    )
}
