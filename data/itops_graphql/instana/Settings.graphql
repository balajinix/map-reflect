type Query {
  # Retrieve all access logs using defined query.
  getAccessLogs: [GetAccessLogs]

  # API to Get All Apdex Configurations.
  getAllApdexConfigurations: [GetAllApdexConfigurations]

  # Create Apdex Configuration
  createApdexConfiguration: CreateApdexConfiguration

  # API to Get All Apdex Configurations for specified entity type and entity id.
  getApdexConfigurationsForEntityTypeAndId(
    entityType: String!
    entityId: String!
  ): [GetApdexConfigurationsForEntityTypeAndId]

  # Delete Apdex Configuration
  deleteApdexConfiguration(id: String!): DeleteApdexConfiguration

  # API to Get Apdex Configuration for specified ID.
  getApdexConfiguration(id: String!): GetApdexConfiguration

  # Get the list of API Tokens for this Tenant-Unit
  getApiTokens: [GetApiTokens]

  # Create an API Token on the Tenant-Unit. Each API Token entry also contains a set of permissions
  postApiToken: PostApiToken

  # Delete the Api Token
  deleteApiToken(id: String!): DeleteApiToken

  # Returns API Token details, including the set of permissions
  getApiToken(id: String!): GetApiToken

  # Update API Token- Change Token name and associated permissions
  putApiToken(id: String!, token: String, permissions: [String]): PutApiToken

  # Retrieve all audit logs using defined query.
  getAuditLogs: [GetAuditLogs]

  # Delete the corresponding tenants Google SSO configuration.
  deleteGoogleSsoConfig: DeleteGoogleSsoConfig

  # Delete the corresponding tenants LDAP configuration.
  deleteLdapConfig: DeleteLdapConfig

  # Delete the corresponding tenants OIDC configuration.
  deleteOidcConfig: DeleteOidcConfig

  # Delete the corresponding tenants SAML configuration.
  deleteSamlConfig: DeleteSamlConfig

  # This API endpoint allows to invite users to this tenant.
  shareAndInviteUsers(emails: [String]!, groups: [String]): ShareAndInviteUsers

  # This API endpoint allows to delete an invitation, requires the users’ email as a Query parameter.
  revokePendingInvitation(email: String!): RevokePendingInvitation

  # This API endpoint retrieves the list of all pending invitations.
  getInvitations: [GetInvitations]

  # This API endpoint allows to invite users to this tenant.
  inviteUsers(emails: [String]!, groups: [String]): InviteUsers

  # All maintenance configurations
  getMaintenanceConfigs: [GetMaintenanceConfigs]

  # Delete maintenance configuration
  deleteMaintenanceConfig(id: String!): DeleteMaintenanceConfig

  # Maintenance configuration
  getMaintenanceConfig(id: String!): GetMaintenanceConfig

  # Create or update maintenance configuration
  putMaintenanceConfig(id: String!, name: String, query: String, scheduling: Scheduling): PutMaintenanceConfig

  # This endpoint retrieves all available maintenance configurations.
  getMaintenanceConfigV2: [GetMaintenanceConfigsV2]

  # This endpoint deletes a maintenance configuration given its ID.
  deleteMaintenanceConfigV2(id: String!): DeleteMaintenanceConfigV2

  # This endpoint retrieves a maintenance configuration given its ID.
  getMaintenanceConfigV2(id: String!): GetMaintenanceConfigV2

  # This endpoint creates or updates a maintenance configuration given its ID.
  putMaintenanceConfigV2(id: String!, name: String, query: String, scheduling: Scheduling, tagFilterExpressionEnabled: Boolean, tagFilterExpression: String): PutMaintenanceConfigV2

  # This endpoint pauses a maintenance configuration given its ID.
  pauseRecurringMaintenanceConfiguration(id: String!): Pauserecurrentmaintenanceconfiguration

  # This endpoint resumes a maintenance configuration given its ID.
  resumeRecurringMaintenanceConfiguration(id: String!): Resumerecurrentmaintenanceconfiguration

  # Get All SLI Configs
  getAllSliConfigs: [GetAllSloConfigs]

  # Create a new SLO Config
  createSloConfig: Createsloconfig

  # Get All SLO Config tags
  getAllSloConfigTags: [GetSloConfigTags]

  # Delete an existing SLO Config
  deleteSloConfig: Deletesloconfig

  # Get an existing SLO Config
  getSloConfig: Getsloconfig

  # Update an existing SLO Config
  updateSloConfig: Updatesloconfig

  # Get All SLI Configs
  getAllSliConfigsV2: [GetAllSliconfigsV2]

  # Create the Service Level Indicator Configuration
  createSliconfigV2: Createsliconfigv2

  # Get all SLI configs for entity type and entity id
  getSliconfigsForEntityTypeAndIdV2(entityType: String!, entityId: String!): [Getsliconfigsforentitytypeandidv2]

  # Delete SLI Config
  deletesliconfigV2(id: String!): Deletesliconfigv2

  # Get SLI Config
  getsliconfigV2(id: String!): Getsliconfigv2
}

