"""
Universal input type for TagFilter or TagFilterExpression.
We have one type that includes:
 - The 'type' discriminator
 - All fields from TagFilter (entity, name, operator, key, value)
 - All fields from TagFilterExpression (elements, logicalOperator)
We rely on the 'type' to figure out which subset of fields should be valid.
"""
input instana_tagFilterExpressionElement_Input {
  """
  -- Fields for if type=TAG_FILTER case --
  Required by JSON schema if type=TAG_FILTER,
  but optional overall in GraphQL because we can't
  conditionally require them in the schema itself.
  """
  entity: instana_groupbyTagEntity
  name: String
  operator: instana_tagOperator_Input
  key: String
  value: JSON
  """
  -- Fields for if type=EXPRESSION case --
  Array of nested tagFilterExpressionElement_Input for recursion.
  """
  elements: [instana_tagFilterExpressionElement_Input!]
  logicalOperator: instana_LogicalOperator
  """
  The discriminator used to decide whether this object
  represents a TAG_FILTER or EXPRESSION.
  """
  type: instana_tagFilterElementType_Input!
}

