syntax = "proto3";

package hashicorp.cloud.internal.infragraph.domain.v1;

import "hashicorp/cloud/internal/infragraph/domain/v1/aws.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/azure.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/gcp.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/hcp.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/hcp_terraform.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/packer.proto";

option go_package = "github.com/hashicorp/cloud-infragraph/proto-internal/go;hashicorp_cloud_infragraph_internal";

// Model is an envelope that contains all the domain models that Infragraph supports.
message Model {
  oneof model {
    AwsEc2Instance aws_ec2_instance = 1;
    AzureVirtualMachine azure_virtual_machine = 2;
    GcpComputeInstance gcp_compute_instance = 3;
    PackerBucket packer_bucket = 4;
    AwsSubnet aws_subnet = 5;
    AwsVpc aws_vpc = 6;
    AwsEcsCluster aws_ecs_cluster = 7;
    AwsEcsService aws_ecs_service = 8;
    PackerRegistry packer_registry = 9;
    AwsAvailabilityZone aws_availability_zone = 10;
    AwsRegion aws_region = 11;
    AwsIamPolicy aws_iam_policy = 12;
    AwsIamUser aws_iam_user = 13;
    AwsAmi aws_ami = 14;
    PackerVersion packer_version = 15;
    AwsSecurityGroup aws_security_group = 17;
    AwsSecurityGroupRule aws_security_group_rule = 23;
    PackerSbom packer_sbom = 18;
    PackerBuild packer_build = 19;
    PackerChannel packer_channel = 20;
    PackerArtifact packer_artifact = 21;
    AwsS3Bucket aws_s3_bucket = 22;
    AwsEc2Volume aws_ec2_volume = 44;
    AwsLambdaFunction aws_lambda_function = 51;
    PackerInheritedRevocation packer_inherited_revocation = 231;
    PackerAncestry packer_ancestry = 232;
    AwsAccount aws_account = 235;
    AwsNetworkInterface aws_network_interface = 240;
    AwsEc2InstanceType aws_ec2_instance_type = 241;
    HcpOrganization hcp_organization = 242;
    HcpProject hcp_project = 243;
    HcpTerraformWorkspace hcp_terraform_workspace = 244;
    HcpTerraformStateVersion hcp_terraform_state_version = 245;
    HcpTerraformOrganization hcp_terraform_organization = 246;
    HcpTerraformProject hcp_terraform_project = 247;
    HcpTerraformAgentPool hcp_terraform_agent_pool = 248;
    HcpTerraformRun hcp_terraform_run = 249;
    AwsIamRole aws_iam_role = 55;
    AwsIamRolePolicyAttachment aws_iam_role_policy_attachment = 56;
  }
}
