  working_year_starts: String
}

type Railway {
  builder: String
  built: String
  location: String
  objectnumber: String
  railway: String
  railway_id: Int
  railway_manage: [Railway_manage] @materializer(query: "railway_manage")
  train: [Train] @materializer(query: "train")
  wheels: String
}

type Railway_manage {
  from_year: String
  manager: Manager @materializer(query: "manager")
  manager_id: Int
  railway: Railway
    @materializer(query: "railwayUsingRailway_manage_railway_id_fkey")
  railway_id: Int
}

type Train {
  arrival: String
  from: String
  name: String
  railway: Railway @materializer(query: "railway")
  railway_id: Int
  train_id: Int
  train_num: String
}

