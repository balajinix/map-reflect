"""
StatFilterApiDTO
Commodities supported values: key = {commodity_key}, relation = sold|bought, virtualDisk = {uuid}. Cost Price supported values: cumulative = true|false, cloudService = {uuid}, target = {uuid}, CSP = {name}, category = {name}, businessUnit = {uuid}, costComponent = COMPUTE|IP|LICENSE|STORAGE, costComponentArtifact = {key}. Please note that the costPrice stat is deprecated and will EOL in 8.12.1. Use the dedicated 'cost' endpoints in /entities, /groups and /markets instead.Action stats supported values: actionTypes = {actionType}, actionModes: {action_mode}, actionStates: {action_state}, riskSubCategory: Performance Assurance|Efficiency Improvement|Prevention|Compliance, riskSeverity: UNKNOWN|NORMAL|MINOR|MAJOR|CRITICAL"
"""
input StatisticsFilterInput {
  type: String
  value: String
  displayName: String
}

input StatInput {
  """
  Name of the stat
  """
  name: String
  """
  Used to get stats from different entity types in the supply chain of {uuid} E.G.costPrice of the VMs where the scope is a PM
  """
  relatedEntityType: String

  """
  Filters to apply to the requested stats.
  """
  filters: [StatisticsFilterInput]

  """
  Execute a groupBy on the values of the stats. Commodities supported values: key, relatedEntity, virtualDisk. Cost Price supported values: cloudService, target, CSP, category, businessUnit, costComponent, costComponentArtifact. Please note that the costPrice stat is deprecated and will EOL in 8.12.1. Use the dedicated 'cost' endpoints in /entities, /groups and /markets instead.Action stats supported values: actionTypes, actionModes, actionStates, risk, riskSubCategory, riskSeverity
  """
  groupBy: [String]
  """
  Query the histUtilization table for these historyTypes Percentile or Smoothed
  """
  historyType: String
}

type Entity {
  className: String
  """
  Limited list of connected entities relevant to the service entity. This will not contain all connected entities.
  """
  connectedEntities: [ConnectedEntitiesEntry]

  """
  List of Consumers
  """
  consumers: [ConsumersEntry]
  """
  Cost price per Hour
  """
  costPrice: Float

  """
  Target that discovered the entity
  """
  discoveredBy: DiscoveredBy

  """
  A user readable name of the api object.
  Cannot be blank.
  The UTF-8 encoding must be at most 255 bytes.
  """
  displayName: String
  """
  Environment type
  Values : HYBRID, CLOUD, ONPREM
  """
  environmentType: EnvironmentType

  numRelatedVMs: Int

  """
  List of Providers
  """
  providers: [ProvidersEntry]
  """
  Highest severity of the Actions related to this entity
  UNKNOWN, NORMAL, MINOR, MAJOR, CRITICAL
  mixed case in response
  """
  severity: String

  """
  severity and count. E.g. {CRITICAL: 1, NORMAL: 10}
  """
  severityBreakdown: SeverityBreakdown
  staleness: String

  state: String

  """
  "Tags are the metadata defined in name/value pairs. Each name can have multiple values.
  """
  tags: JSON # map of arb. types does not translate well to graphql [ will always be missing data since the key names are arb. ]
  """
  Related Template
  """
  template: Template

  uuid: ID

  """
  Mapping of target identifier to vendor-provided identity of this entity on the remote target
  """
  vendorIds: JSON # map of arb.  does not translate well to graphql [ will always be missing data since the key names are arb. ]
}

