# Here are the GraphQL type definitions for the provided tables:

# """
# Represents a client in the OAuth2 system.
# """
type Client {
  """The ID of the client"""
  clientId: String!

  """The name of the client"""
  clientName: String!

  """The OAuth2 grants that the client can perform in order to acquire a token"""
  grantTypes: String

  """The authentication methods that the client supports when acquiring a token"""
  clientAuthenticationMethods: String

  """The scopes that the client can request when acquiring a token"""
  scopes: String

  """The audience that the client can request when acquiring a token"""
  audience: String

  """Creation timestamp"""
  createdAt: String

  """The token settings for the client"""
  tokenSettings: String

  """The client secret"""
  clientSecret: String
}

