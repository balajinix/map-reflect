"""provider organizations including hospitals."""
type synthea_ORGANIZATIONS {
  "primary key of the organization."
  id: String
  "name of the organization."
  name: String
  "organization's street address without commas or newlines."
  address: String
  "street address city."
  city: String
  "street address state abbreviation."
  state: String
  "street address zip or postal code."
  zip: String
  "organization's phone number."
  phone: String
  "the number of encounter's performed by this organization."
  utilization: String
}

type Query {
  organizationsList: [synthea_ORGANIZATIONS]
  organizations(id: ID!): synthea_ORGANIZATIONS
}