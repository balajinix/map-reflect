"""
NSOne Connect - Internet Weather API for Solis-DAL.

pulsar appsapis

*Experimental - subject to change*
"""
enum JobTypeID {
  """
  responseTime measure
  """
  latency

  custom
}
"""
Pulsar job metadata
"""
type AppJob {
  """
  customer id of the job owner
  """
  customer: Int

  """
  job appid
  """
  appid: ID

  """
  app job id
  """
  jobid: ID

  """
  descriptive name
  """
  name: String

  typeid: JobTypeID

  """
  job is active and usable for routing
  """
  active: Boolean

  """
  measurements and data publically available
  """
  community: Boolean
  """
  visible and usuable by to other customers
  """
  shared: Boolean

  """
  details about the job configuration
  """
  config: JobConfig
}

"""
Pulsar job details
"""
type JobConfig {
  """
  Hostname where the resource to be measured is located
  """
  host: String

  """
  URL path to be appended to the host
  """
  url_path: String

  """
  use HTTP in measurements
  """
  http: Boolean

  """
  use HTTPS in measurements
  """
  https: Boolean

  """
  Maximum timeout per request
  """
  request_timeout_millis: Int

  """
  Maximum timeout per job
  """
  job_timeout_millis: Int

  """
  Whether to use XHR when taking measurements
  """
  use_xhr: Boolean

  """
  Whether to skip aggregation for this job's measurements
  """
  static_values: Boolean

  """
  metrics weights
  """
  blend_metric_weights: JSON
}

input BoolFilter {
  eq: Boolean
  ne: Boolean
}
input JobsFilter {
  #  or: JobsFilter
  #  and: JobsFilter

  """
  equal filter on jobid will filter to 0 or 1 entries
  """
  jobid: ID

  """
  community only
  """
  community: BoolFilter
  """
  shared only
  """
  shared: BoolFilter
  """
  active only
  """
  active: BoolFilter
}

extend type Query {
  """
  list of current jobs associated with an application
  """
  appJobs(
    """
    app id to show jobs for
    """
    appid: ID

    filter: JobsFilter
  ): [AppJob] @materializer(query: "_appJobs")

  """
  list of current jobs associated with an application
  """
  _appJobs(
    """
    app id to show jobs for
    """
    appid: ID
    # TODO: PUSH THESE INTO FILTER
    """
    community only
    """
    community: Boolean
    """
    shared only
    """
    shared: Boolean
    """
    active only
    """
    active: Boolean
  ): [AppJob]
    @rest(use: "internet_weather", path: "/v1/pulsar/apps/$appid/jobs")

  """
  returns information on a single job in a specific app
  """
  appJob(appid: ID, jobid: ID): AppJob
}
