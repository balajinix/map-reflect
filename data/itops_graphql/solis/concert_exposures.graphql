type concert_Issue {
  "Comment about the issue"
  comment: String
  "When the issue was fixed"
  fixed_on: Int
  "Unique ID of the issue"
  id: String
  "Type of ID"
  id_type: String
  "Link to the external issue tracking system"
  issue_link: concert_IssueLink
  "Who last updated the issue"
  last_updated_by: String
  "Last updated timestamp"
  last_updated_on: Int
  "When the issue was opened"
  opened_on: Int
  "Current status"
  status: String
}

type concert_Exposures {
  "Additional data"
  additional_data: String
  "Assessment ID"
  assessment_id: String
  "Assessment status"
  assessment_status: String
  "Associations information"
  associations: concert_ExposureAssociationsDetails
  "Count of exposures"
  count: Int
  "Created timestamp"
  created_on: Int
  "CWE ID"
  cwe_id: String
  "Description"
  description: String
  "Exposure object attribute 1"
  exposure_object_attr1: String
  "Exposure object attribute 2"
  exposure_object_attr2: String
  "Exposure object attribute 3"
  exposure_object_attr3: String
  "Exposure object ID"
  exposure_object_id: String
  "Exposed path"
  exposure_path: String
  "Exposure type"
  exposure_type: String
  "Unique ID"
  id: String
  "Whether it's archived"
  is_archived: Boolean
  "Associated issues"
  issues: [concert_Issue]
  "Last updated by"
  last_updated_by: String
  "Last updated timestamp"
  last_updated_on: Int
  "Other information"
  other_info: String
  "Priority classification"
  priority: String
  "Rule ID"
  rule_id: String
  "Rule name"
  rule_name: String
  "Scan type"
  scan_type: String
  "Score"
  score: Float
  "Severity level"
  severity: String
  "Solution information"
  solution: String
  "Status"
  status: String
  "Tool names that found this exposure"
  tool_names: [String]
  "Tool version"
  tool_version: String
  "WASC ID"
  wasc_id: String
}

type concert_ExposureAssociationsDetails {
  "Access point IDs"
  access_points: [String]
  "Application IDs"
  applications: [String]
  "Environment IDs"
  environments: [String]
  "Source repository IDs"
  source_repos: [String]
}

type concert_ExposuresCollection {
  "List of exposures"
  exposures: [concert_Exposures]
}

enum concert_SortDirection {
  "Sort in ascending order"
  asc
  "Sort in descending order"
  desc
}

type concert_IssueLink {
  "Array of Assignees"
  assignees: [String!]!
  "Represents if the issue is updated"
  has_issue_updated: Boolean
  "Issue ID"
  issue_id: String!
  "Array of labels"
  labels: [String!]!
  "System"
  system: String!
  "System Status"
  system_status: String!
  "URL"
  url: String!
}

type Query {
  concert_exposures(
    filter: String
    page_number: Int
    page_size: Int
    search: String
    sort_by: String
    sort_direction: concert_SortDirection
    token: Secret
  ): concert_ExposuresCollection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
