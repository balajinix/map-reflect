  purchases: [Purchases] @materializer(query: "purchases")
  ref_transaction_types: Ref_transaction_types
    @materializer(
      query: "ref_transaction_typesUsingTransactions_transaction_type_code_fkey"
    )
  sales: Sales @materializer(query: "salesUsingSales_sales_transaction_id_fkey")
  share_count: String
  transaction_id: ID!
  transaction_type_code: String
}

