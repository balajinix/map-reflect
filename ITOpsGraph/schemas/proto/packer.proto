syntax = "proto3";

package hashicorp.cloud.internal.infragraph.domain.v1;

import "google/protobuf/timestamp.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/base.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/hcp.proto";
import "hashicorp/cloud/internal/infragraph/options/v1/options.proto";

option go_package = "github.com/hashicorp/cloud-infragraph/proto-internal/go;hashicorp_cloud_infragraph_internal";

// PackerRegistry domain model message.
message PackerRegistry {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_REGISTRY";

  Base base = 1;
  HcpResource hcp_resource = 2;
  optional string feature_tier = 3;
  optional bool activated = 4;
  optional int32 billing_deprovision_reason = 5;
  optional string billing_deprovision_message = 6;
}

// PackerBucket domain model message.
message PackerBucket {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_BUCKET";

  Base base = 1;
  HcpResource hcp_resource = 2;

  // id of the parent registry
  optional string registry_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_REGISTRY"
  ];

  // array of the platforms associated with the bucket
  // TODO: string array currently unsupported by codegen
  repeated string platforms = 4;
}

// PackerInheritedRevocation domain model message.
message PackerInheritedRevocation {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_INHERITED_REVOCATION";

  Base base = 1;
  HcpResource hcp_resource = 2;

  optional string descendant_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_VERSION"
  ];
  optional string ancestor_id = 4 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_VERSION"
  ];
}

// PackerSBOM domain model message.
message PackerSbom {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_SBOM";

  Base base = 1;
  HcpResource hcp_resource = 2;

  // id of the parent build
  optional string build_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUILD"
  ];

  // sbom format type
  optional string format = 4;
}

// PackerBuild domain model message.
message PackerBuild {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_BUILD";

  Base base = 1;
  HcpResource hcp_resource = 2;

  // id of the parent version
  optional string version_id = 3 [
    (options.v1.edge_label) = "PRODUCES",
    (options.v1.edge_direction) = "OUTGOING",
    (options.v1.node_label) = "PACKER_VERSION"
  ];

  // id of the source
  optional string source_external_identifier = 4 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_SOURCE"
  ];

  optional string component_type = 5;
  optional string packer_run_uuid = 6;
  optional string platform = 7;
  optional string status = 8;
}

// PackerAncestry domain model message.
message PackerAncestry {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_ANCESTRY";

  Base base = 1;
  HcpResource hcp_resource = 2;

  // id of the parent bucket
  optional string parent_bucket_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  // id of the child bucket
  optional string child_bucket_id = 4 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  // id of the child bucket
  optional string parent_version_id = 5 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  // id of the child bucket
  optional string child_version_id = 6 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  optional string channel_name = 7;

  // id of the channel
  optional string channel_id = 8 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_CHANNEL"
  ];
}

// PackerVersion domain model message
message PackerVersion {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_VERSION";

  Base base = 1;
  HcpResource hcp_resource = 2;

  optional string bucket_id = 3 [
    (options.v1.edge_label) = "STORES",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  string status = 5;
  string author_id = 6;
  optional string revocation_type = 7;
  optional string revocation_message = 8;
  optional string revocation_author = 9;
  optional google.protobuf.Timestamp revoked_at = 10;
  optional string template_type = 11;
}

message PackerChannel {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_CHANNEL";

  Base base = 1;
  HcpResource hcp_resource = 2;

  string bucket_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "OUTGOING",
    (options.v1.node_label) = "PACKER_BUCKET"
  ];

  string version_id = 4 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_VERSION"
  ];

  string author_id = 5;
  bool managed = 6;
  bool restricted = 7;
}

// PackerArtifact domain model message
message PackerArtifact {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "HCP_PACKER";
  option (options.v1.message_kind) = "PACKER_ARTIFACT";

  Base base = 1;
  HcpResource hcp_resource = 2;

  string build_id = 3 [
    (options.v1.edge_label) = "PRODUCES",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "PACKER_BUILD"
  ];

  string external_identifier = 4 [
    (options.v1.edge_label) = "PRODUCES",
    (options.v1.edge_direction) = "OUTGOING",
    (options.v1.node_label) = "VIRTUAL_MACHINE_IMAGE"
  ];

  string region = 5;
}
