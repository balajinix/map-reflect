schema {
  query: Query
  mutation: Mutation
}

"""
Root Query type that provides read operations for the IBM Concert Access Management API.
"""
type Query {
  """
  Returns details for the current API key.
  """
  apiKey: ApiKeyDate
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/apikey"
      method: GET
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )

  """
  Returns a list of all users and user groups associated with your Concert instance.
  """
  usersGroups: UsersGroupsCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/users_groups"
      method: GET
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )
}

"""
Root Mutation type that provides write operations for the IBM Concert Access Management API.
"""
type Mutation {
  """
  Generates an authentication token to login to a Concert instance deployed on a virtual machine.
  """
  login(
    """User's username"""
    username: String!
    """User's password"""
    password: String!
  ): TokenDetails
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/login"
      method: POST
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      contenttype: "application/json"
      configuration: "ibmConcert"
    )

  """
  Generates a new Concert API key.
  """
  generateApiKey: ApiKey
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/apikey"
      method: POST
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )

  """
  Deletes the current API key. You must generate a new key to continue using the API.
  """
  deleteApiKey: Boolean
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/apikey"
      method: DELETE
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ]
      configuration: "ibmConcert"
    )
}

"""
Contains user credentials for login
"""
input CredentialsInput {
  """User's username"""
  username: String!
  """User's password"""
  password: String!
}

"""
Details of the authentication token
"""
type TokenDetails {
  """The authentication token"""
  token: String
}

"""
Error response object
"""
type ErrorResponse {
  """Error message"""
  error: String
}

"""
API key object with date information
"""
type ApiKeyDate {
  """The API key"""
  apiKey: String
}

"""
API key object
"""
type ApiKey {
  """The generated API key"""
  key: String
}

"""
Collection of users and groups
"""
type UsersGroupsCollection {
  """List of user groups"""
  groups: [String]
}

