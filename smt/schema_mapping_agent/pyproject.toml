[project]
name = "schema-mapping-agent"
version = "0.1.0"
description = "GraphQL Schema Mapping Agent with A2A Protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.2.5,<0.3.0",
    "httpx>=0.28.1",
    "langchain-community>=0.0.20",
    "langgraph>=0.3.18",
    "pydantic>=2.11.3",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.2",
    "langchain-core",
    "sentence-transformers>=2.2.0",
    "requests>=2.31.0",
    "numpy>=1.26.4",
    "litellm>=1.0.0",
    "ibm_watsonx_ai>=1.3.18",
    "schema-mapping-toolkit[genaimapping] @ git+ssh://git@github.ibm.com/Avirup-Saha2/schema-mapping-toolkit.git@solis"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
