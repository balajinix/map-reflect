"""
getCallGroup is a GraphQL endpoint that implements the Instana API /api/application-monitoring/analyze/call-groups
 for Application answers.  You can use this API to fetch time series metrics such as the highest latency, the top erroneous calls, rates, total
 number of calls, that are handled by some specific application and then you can group by things like service name, endpoint name, HTTP call path or URL.
 The primary drivers are timeFrame, group, order, tagFilterExpression, and metrics. You MUST use variables instead of constants in the GraphQL query due
 to quoting issues. A good call will use variables and fill in values for input based upon the GraphQL schema.

 **Important!! YOU MUST first call the world_time_api to help calculate "timeFrame" input. This tool only gives you the current time so you'll need to calculate
 for exact timeFrame variables to answer the question correctly which is critical.

  - ** Example usage ** -

  Sample input - DO NOT USE THESE VALUES:

  ```json
  {
    "timeFrame": {
        "to": 1738868023319,
        "focusedMoment": 1738868023319,
        "autoRefresh": false,
        "windowSize": 86400000
    },
    "tagFilterExpression": {
        "type": "EXPRESSION",
        "logicalOperator": "AND",
        "elements": [
            {
                "type": "TAG_FILTER",
                "name": "application.name",
                "operator": "EQUALS",
                "entity": "DESTINATION",
                "value": "Robot Shop - EP"
            },
            {
                "type": "TAG_FILTER",
                "name": "call.erroneous",
                "operator": "EQUALS",
                "entity": "NOT_APPLICABLE",
                "value": true
            }
        ]
    },
    "metrics": [
        {
            "metric": "calls",
            "aggregation": "SUM"
        }
    ],
    "order": {
        "by": "calls",
        "direction": "DESC"
    },
    "group": {
        "groupbyTag": "endpoint.name",
        "groupbyTagEntity": "DESTINATION"
    },
    "pagination": {"retrievalSize":5},
    "includeInternal": false,
    "includeSynthetic": false
  }
  ```

