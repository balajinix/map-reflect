query MyQuery {
  llmFriendlyCostReport(
    dateRange: {end: "2025-05-01", start: "2025-04-01"}
    dimensions: [VENDOR, CATEGORY24]
    metrics: ADJUSTED_COST
    filter: {vendor: {eq: "Amazon"}}
  ) {
    results {
      vendor
      category24
      adjusted_cost
    }
  }
}

query two {
  llmFriendlyCostReport(
    dateRange: {
      start: "2025-05-01"
      end: "2025-05-31"
    }
    dimensions: [VENDOR, SERVICE_NAME]
    metrics: [UNBLENDED_COST]
  ) {
    results {
      vendor
      service_name
      unblended_cost
    }
    meta {
      dates {
        start
        end
      }
    }
  }
}

query three {
  llmFriendlyCostReport(
    dateRange: {
      start: "2025-05-01"
      end: "2025-05-31"
    }
    dimensions: [VENDOR, SERVICE_NAME, REGION, ACCOUNT_NAME]
    metrics: [UNBLENDED_COST, USAGE_HOURS, USAGE_QUANTITY]
    sort: [{ field: "unblendedCost", direction: DESC }]
    limit: 50
  ) {
    results {
      vendor
      service_name
      region
      account_name
      unblended_cost
      usage_hours
      usage_quantity
    }
    meta {
      dates {
        start
        end
      }
    }
    total_results
  }
}

