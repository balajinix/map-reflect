type Query {
  # Deletes the automation action run results from the action run history.
  deleteActionInstances(
    from: String
    to: String
    filters: [String]
  ): Deleteactioninstances

  # Get the details of automation action run results from action run history.
  getActionInstances(
    windowSize: Int
    to: String
    filters: [String]
    page: Int
    pageSize: Int
  ): [Getactioninstances]

  # Submits the automation action for execution on an agent.
  addActionInstance(
    actionId: String
    hostId: String
    requestPayload: String
  ): Addactioninstance

  # Deletes the automation action run result specified in the request path from the action run history.
  deleteActionInstance(
    actionInstanceId: String
    from: String
    to: String
  ): Deleteactioninstance

  # Get the details of automation action run result specified in the request path from action run history.
  getActionInstance(
    actionInstanceId: String
  ): Getactioninstance

  # Get all automation actions.
  getActions: [Getactions]

  # Get an automation action by ID specified in the request path.
  getActionById(
    actionId: String
  ): Getactionbyid

  # Get automation actions that match the incident or issue data in the request body.
  getActionMatches(
    incidentData: String
  ): [Getactionmatches]

  # Resolve dynamic parameter values.
  resolve(
    dynamicParameter: String
  ): Resolve

  # Get tag catalog for dynamic parameters.
  getDynamicParametersTagCatalog: Getdynamicparameterstagcatalog

  # Returns all the automation policies filtered by the values in optional query parameters.
  getPolicies(
    filters: [String]
  ): [Getpolicies]

