# Copyright IBM Corp. 2025
# /api/v3/markets

type Query {
  """
  market actions
  default market is "Market"
  """
  marketActions(
    market_uuid: ID! = "Market"
    detail_level: DetailLevel
    cursor: String
    limit: Int
    order_by: OrderBy
    ascending: Boolean
    environment_type: EnvironmentType
  ): [Action]
    @sequence(
      steps: [
        { query: "_accessTokenTurbonomics" }
        {
          query: "_marketActions"
          arguments: [
            # needed because marketActions doesn't inherit arguments
            { name: "detail_level", argument: "detail_level" }
            { name: "environment_type", argument: "environment_type" }
            { name: "cursor", argument: "cursor" }
            { name: "limit", argument: "limit" }
            { name: "order_by", argument: "order_by" }
            { name: "ascending", argument: "ascending" }
          ]
        }
      ]
    )

  _marketActions(
    market_uuid: ID! = "Market"
    detail_level: DetailLevel
    cursor: String
    limit: Int
    order_by: OrderBy
    ascending: Boolean
    environment_type: EnvironmentType
    access_token: Secret!
  ): [Action]
    @rest(
      endpoint: "https://$hostname;/api/v3/markets/$market_uuid;/actions"
      configuration: "turbonomics"
      headers: [{ name: "authorization", value: "bearer $access_token" }]
    )

  """
  filtered marketActions
  default market is "Market"
  """
  marketActionsFiltered(
    market_uuid: ID! = "Market"
    cursor: Int = 0
    limit: Int = 1000
    order_by: OrderBy = SEVERITY
    ascending: Boolean = true

    ### PARTIAL LIST OF FILTERS
    environment_type: EnvironmentType
    relatedEntityTypes: [String!]
    targetEntityTypes: [String!]
    relatedCloudServiceProviderIds: [String!]
    groupBy: [String!]
    startTime: DateTime
    endTime: DateTime
    # snake to camel
    detailLevel: DetailLevel
    tagValueFilter: TagValueFilterInput

    actionStateList: [ActionState]
    cleared: Boolean
    actionModeList: [ActionMode]
    vendorIds: [String]
  ): [Action]
    @sequence(
      steps: [
        { query: "_accessTokenTurbonomics" }
        {
          query: "_marketActionsFiltered"
          arguments: [
            # needed because marketActions doesn't inherit arguments

            { name: "cursor", argument: "cursor" }
            { name: "limit", argument: "limit" }
            { name: "order_by", argument: "order_by" }
            { name: "environment_type", argument: "environment_type" }
            { name: "relatedEntityTypes", argument: "relatedEntityTypes" }
            { name: "targetEntityTypes", argument: "targetEntityTypes" }
            {
              name: "relatedCloudServiceProviderIds"
              argument: "relatedCloudServiceProviderIds"
            }
            { name: "groupBy", argument: "groupBy" }
            { name: "startTime", argument: "startTime" }
            { name: "endTime", argument: "endTime" }
            { name: "detailLevel", argument: "detailLevel" }
            { name: "tagValueFilter", argument: "tagValueFilter" }
            { name: "actionStateList", argument: "actionStateList" }
            { name: "cleared", argument: "cleared" }
            { name: "actionModeList", argument: "actionModeList" }
            { name: "vendorIds", argument: "vendorIds" }
          ]
        }
      ]
    )

  _marketActionsFiltered(
    market_uuid: ID! = "Market"
    cursor: Int = 0
    limit: Int = 1000
    order_by: OrderBy = SEVERITY
    ascending: Boolean = true

    environment_type: EnvironmentType
    relatedEntityTypes: [String!]
    targetEntityTypes: [String!]
    relatedCloudServiceProviderIds: [String!]
    groupBy: [String!]
    startTime: String
    endTime: String
    # snake to camel
    detailLevel: DetailLevel
    tagValueFilter: TagValueFilterInput

    actionStateList: [ActionState]
    cleared: Boolean
    actionModeList: [ActionMode]
    vendorIds: [String]

    access_token: Secret!
  ): [Action]
    @rest(
      method: POST
      # these query parameters end up in body for now, but turbonomics seems to ignore so leave for now (use bodyPOST to remove if need)
      endpoint: "https://$hostname;/api/v3/markets/$market_uuid;/actions?cursor=$cursor&limit=$limit&order_by=$order_by&ascending=$ascending"
      configuration: "turbonomics"
      headers: [
        { name: "authorization", value: "bearer $access_token" }
        { name: "Content-Type", value: "application/json" }
      ]
    )

  marketEntities(
    market_uuid: ID! = "Market"
    cursor: Int
    limit: Int
    order_by: OrderBy
    ascending: Boolean
  ): [Entity]
    @sequence(
      steps: [
        { query: "_accessTokenTurbonomics" }
        {
          query: "_marketEntities"
          arguments: [
            # needed because this doesn't inherit arguments
            { name: "market_uuid", argument: "market_uuid" }
            { name: "cursor", argument: "cursor" }
            { name: "limit", argument: "limit" }
            { name: "order_by", argument: "order_by" }
            { name: "ascending", argument: "ascending" }
          ]
        }
      ]
    )

  _marketEntities(
    market_uuid: ID! = "Market"
    cursor: Int
    limit: Int
    order_by: OrderBy
    ascending: Boolean
    access_token: Secret!
  ): [Entity]
    @rest(
      endpoint: "https://$hostname;/api/v3/markets/$market_uuid;/entities"
      configuration: "turbonomics"
      headers: [{ name: "authorization", value: "bearer $access_token" }]
    )
}
