"""Source repository summary"""
type WorkspaceRepositorySummary {
  """Repository ID"""
  id: String
  """Repository URL"""
  repo_url: String
  """Repository name"""
  name: String
  """Commit SHA"""
  commit_sha: String
  """Branch name"""
  branch: String
  """CycloneDX link"""
  cyclonedx_link: String
  """Repository tags"""
  tags: [TagsPrototype]
  """Last updated timestamp"""
  last_updated_on: Int
  """Last updated by"""
  last_updated_by: String
}