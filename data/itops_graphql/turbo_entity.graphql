type turbo_Entity {
  "allow entity to access its actions"
  actions(
    ascending: Boolean
    cursor: String
    limit: Int
    order_by: turbo_OrderBy
  ): [turbo_Action]
  className: String
  "Limited list of connected entities relevant to the service entity. This will not contain all connected entities."
  connectedEntities: [turbo_ConnectedEntitiesEntry]
  "List of Consumers"
  consumers: [turbo_ConsumersEntry]
  "Cost price per Hour"
  costPrice: Float
  "Target that discovered the entity"
  discoveredBy: turbo_DiscoveredBy
  """
  A user readable name of the api object.
  Cannot be blank.
  The UTF-8 encoding must be at most 255 bytes.
  """
  displayName: String
  """
  Environment type
  Values : HYBRID, CLOUD, ONPREM
  """
  environmentType: turbo_EnvironmentType
  numRelatedVMs: Int
  "List of Providers"
  providers: [turbo_ProvidersEntry]
  """
  Highest severity of the Actions related to this entity
  UNKNOWN, NORMAL, MINOR, MAJOR, CRITICAL
  mixed case in response
  """
  severity: String
  "severity and count. E.g. {CRITICAL: 1, NORMAL: 10}"
  severityBreakdown: turbo_SeverityBreakdown
  staleness: String
  state: String
  stats: [turbo_Statistics]
  "\"Tags are the metadata defined in name/value pairs. Each name can have multiple values."
  tags: JSON
  "Related Template"
  template: turbo_Template
  uuid: ID
  "Mapping of target identifier to vendor-provided identity of this entity on the remote target"
  vendorIds: JSON
}

