query GetClusters($start: String, $end: String, $pretty: String) {
  clusters(start: $start, end: $end, pretty: $pretty) {
    result {
      meta {
        firstSeenDate
        orgHasData
        orgHasProvisioned
      }
      clusters {
        id
        name
        firstSeen
        lastSeen
        provisionedAt
        nodes {
          resourceIdentifier
          vendor
        }
      }
    }
  }
}