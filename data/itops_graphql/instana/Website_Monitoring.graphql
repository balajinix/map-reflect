  createdAt: String!
  updatedAt: String!
}

# """
# Type representing Website Catalog Metrics
# """
type GetWebsiteCatalogMetrics {
  id: ID!
  websiteId: ID!
  pageViews: Int!
  uniqueVisitors: Int!
  bounceRate: Float!
  averageSessionDuration: Float!
  createdAt: String!
  updatedAt: String!
}

# """
# Type representing a Website Tag
# """
type GetWebsiteTag {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String!
  websiteId: ID!
}

# """
# Type representing a Website
# """
type GetWebsite {
  id: ID!
  name: String!
  domain: String!
  description: String
  createdAt: String!
  updatedAt: String!
  geoLocationConfiguration: GetWebsiteGeoLocationConfiguration
  iPMaskingConfiguration: GetWebsiteIpMaskingConfiguration
  geomappingRules: [GetWebsiteGeomappingRule!]!
  sourceMapUploadConfiguration: GetWebsiteSourceMapUploadConfiguration
  tags: [GetWebsiteTag!]!
  metrics: [GetWebsiteCatalogMetrics!]!
}

