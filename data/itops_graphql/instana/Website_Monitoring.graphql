type Query {
  getBeaconGroups: [GetBeaconGroup] @rest(table_name: "Getbeacongroups")
  getBeacons: [GetBeacon] @rest(table_name: "Getbeacons")
  getWebsiteTagCatalog: GetWebsiteTagCatalog @rest(table_name: "Getwebsitetagcatalog")
  getWebsiteCatalogMetrics: [GetWebsiteCatalogMetrics] @rest(table_name: "Getwebsitecatalogmetrics")
  getWebsiteCatalogTags: [GetWebsiteTag] @rest(table_name: "Getwebsitecatalogtags")
  getWebsites: [GetWebsite] @rest(table_name: "Getwebsites")
  createWebsite(input: CreateWebsiteInput): GetWebsite @rest(table_name: "Createwebsite")
  deleteWebsite(input: DeletewebsiteInput): Boolean @rest(table_name: "Deletewebsite")
  renameWebsite(input: RenameWebsiteInput): GetWebsite @rest(table_name: "Renamewebsite")
  getWebsite(websiteId: ID!): GetWebsite @rest(table_name: "Getwebsite")
  getWebsiteGeoLocationConfiguration(websiteId: ID!): GetWebsiteGeoLocationConfiguration @rest(table_name: "Getwebsitegeolocationconfiguration")
  updateWebsiteGeoLocationConfiguration(input: UpdateWebsiteGeoLocationConfigurationInput): GetWebsiteGeoLocationConfiguration @rest(table_name: "Updatewebsitegeolocationconfiguration")
  getWebsiteGeomappingRules: [GetWebsiteGeomappingRule] @rest(table_name: "Getwebsitegeomappingrules")
  setWebsiteGeomappingRules(input: SetWebsiteGeomappingRuleInput): [GetWebsiteGeomappingRule] @rest(table_name: "Setwebsitegeomappingrules")
  getWebsiteIpMaskingConfiguration(websiteId: ID!): GetWebsiteIpMaskingConfiguration @rest(table_name: "Getwebsiteipmaskingconfiguration")
  updateWebsiteIpMaskingConfiguration(input: UpdateWebsiteIpMaskingConfigurationInput): GetWebsiteIpMaskingConfiguration @rest(table_name: "Updatewebsiteipmaskingconfiguration")
  clearSourceMapUploadConfiguration(input: ClearSourceMapUploadConfigurationInput): Boolean @rest(table_name: "Clearsourcemapuploadconfiguration")
  uploadSourceMapFile(input: UploadSourceMapFileInput): Boolean @rest(table_name: "Uploadsourcemapfile")
  getBeaconMetrics: [GetBeaconMetrics] @rest(table_name: "Getbeaconmetrics")
  getPageLoad: [GetPageLoad] @rest(table_name: "Getpageload")
  getBeaconMetricsV2: [GetBeaconMetricsV2] @rest(table_name: "Getbeaconmetricsv2")
}
