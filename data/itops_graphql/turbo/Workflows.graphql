type Links {
  rel: String
  href: String
  hreflang: String
  media: String
  title: String
  type: String
  deprecation: String
  profile: String
  name: String
}

type Parameter {
  links: Links
  uuid: String
  displayName: String!
  className: String
  name: String!
  value: String
  defaultValue: String
  isMandatory: Boolean
  isSecret: Boolean
  isMultiline: Boolean
  isTargetDisplayName: Boolean
  valueType: String
  specificValueType: String
  description: String
  verificationRegex: String
  groupProperties: String
  allowedValues: String
  dependencyKey: String
  dependencyValue: String
}

type Query {
  # Gets a list of discovered workflows
  getworkflows: [Getworkflows] @rest(
    method: "GET",
    path: "/getworkflows",
    queryKeys: ["$limit", "$offset"],
    responseType: "Getworkflows"
  )

  # Create a new workflow
  addworkflow(input: AddworkflowInput): Addworkflow @rest(
    method: "POST",
    path: "/addworkflow",
    responseType: "Addworkflow"
  )

  # Gets detailed information for the specified workflow
  getworkflowbyuuid(uuid: String!): Getworkflowbyuuid @rest(
    method: "GET",
    path: "/getworkflowbyuuid/{uuid}",
    responseType: "Getworkflowbyuuid"
  )

  # Edit a Workflow
  editworkflow(uuid: String!, input: EditworkflowInput): Editworkflow @rest(
    method: "PUT",
    path: "/editworkflow/{uuid}",
    responseType: "Editworkflow"
  )

  # Performs an operation on a workflow.
  performoperation(uuid: String!, input: PerformoperationInput): Performoperation @rest(
    method: "POST",
    path: "/performoperation/{uuid}",
    responseType: "Performoperation"
  )

  # Delete a specified workflow
  deleteworkflow(uuid: String!): Deleteworkflow @rest(
    method: "DELETE",
    path: "/deleteworkflow/{uuid}",
    responseType: "Deleteworkflow"
  )

  # Get all policies used by this workflow.
  getworkflowspolicies(uuid: String!): [Getworkflowspolicies] @rest(
    method: "GET",
    path: "/getworkflowspolicies/{uuid}",
    responseType: "Getworkflowspolicies"
  )
}

