"""
AccessToken generation

two ways to auth that require slightly different URLs
api.dl.watson-orchestrate.ibm.com - uses bearer tokens derived from the IAM-API-KEY [ in config ]
api.us-south.watson-orchestrate.cloud.ibm.com - old style, uses IAM-API-KEY directly
Note: for now we pass in both the Authorization and IAM-API_KEY to calls; this means non-ibm cloud calls
have IAM-API-TOKEN showing.  Fix later.
"""
type AccessToken {
  token: String
  token_type: String
  expired_in: Int
}

# for sequence
type _CloudIBM {
  is_cloud_ibm: Boolean
}

# slightly convoluted pathway to allow for both ibm cloud (IAM API_KEY) and non-ibm cloud services (Bearer)
type Query {
  """
  return access token if !is_ibm_cloud_hostname
  """
  _accessToken: AccessToken
    @sequence(
      steps: [
        { query: "_is_ibm_cloud_hostname" }
        { query: "_get_access_token" }
      ]
    )

  """
  will get an access token from IAM if is_cloud_ibm else it will not return a value
  """
  _get_access_token(is_cloud_ibm: Boolean, apikey: Secret): AccessToken

  """
  true if hostname is in IBM cloud .cloud.ibm.com
  """
  _is_ibm_cloud_hostname: _CloudIBM
    @rest(
      endpoint: "stepzen:empty"
      configuration: "wxo"
      ecmascript: """
      function transformREST(s) {
        return JSON.stringify({ "is_cloud_ibm": get("hostname")?.endsWith(".cloud.ibm.com")});
      }
      """
    )

  """
  supplies an IAM access token if not is_cloud_ibm to _get_access_token
  """
  _iam_accessToken(is_cloud_ibm: Boolean, apikey: Secret): AccessToken!
    @supplies(query: "_get_access_token", if: { src: "!is_cloud_ibm" })
    @rest(
      endpoint: "https://iam.platform.saas.ibm.com/siusermgr/api/1.0/apikeys/token"
      method: POST
      configuration: "wxo-guard"
      contenttype: "application/json"
      ecmascript: """
      function bodyPOST(s) {
         return JSON.stringify({ apikey: get("apikey") })
      }
      function transformREST(body) {
        if (status == 200) {
           return body
        }
        //
        let resp = JSON.parse(body);
        throw new Error(`IAM: ${JSON.stringify(resp)}`);
      }
      """
    )
}

"""
AssistantRun Connection with edges
"""
type AssistantRunConnection {
  edges: [AssistantRunEdge]
  pageInfo: PageInfo!
}

"""
AssistantRun Edge with node
"""
type AssistantRunEdge {
  node: AssistantRun
  cursor: String
}

type Query {
  """
  Get an AI agent run events
  If stream_timeout is encountered, partial results will be returned.
  """
  chatRunEvents(
    run_id: ID!
    """
    The maximum time in milliseconds to wait for event stream.  Default: 1000
    """
    stream_timeout: Int
  ): [RunEvent]
    @sequence(
      steps: [
        { query: "_accessToken" }
        {
          query: "_chatRunEvents"
          arguments: [
            # needed because non-zero step doesn't inherit arguments
            { name: "run_id", argument: "run_id" }
            { name: "stream_timeout", argument: "stream_timeout" }
          ]
        }
      ]
    )

  _chatRunEvents(
    run_id: ID!
    token: Secret
    stream_timeout: Int
    iam_api_key: Secret
  ): [RunEvent]
    @rest(
      endpoint: "https://$hostname;/instances/$tenantid;/v1/orchestrate/runs/$run_id;/events"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "Authorization", value: "Bearer $token" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo"
    )

  """
  Get an AI agent run
  """
  chatRun(run_id: ID): AssistantRun
    @sequence(
      steps: [
        { query: "_accessToken" }
        {
          query: "_chatRun"
          arguments: [
            # needed because non-zero step doesn't inherit arguments
            { name: "run_id", argument: "run_id" }
          ]
        }
      ]
    )

  _chatRun(run_id: ID, token: Secret): AssistantRun
    @rest(
      endpoint: "https://$hostname;/instances/$tenantid;/v1/orchestrate/runs/$run_id;"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "Authorization", value: "Bearer $token" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo"
    )

  """
  Lists an AI agent runs
  """
  chatRuns(first: Int = 10, after: String = ""): AssistantRunConnection
    @sequence(
      steps: [
        { query: "_accessToken" }
        {
          query: "_chatRuns"
          arguments: [
            { name: "first", argument: "first" }
            { name: "after", argument: "after" }
          ]
        }
      ]
    )

  _chatRuns(
    first: Int = 10
    after: String = ""
    token: Secret
  ): AssistantRunConnection
    @rest(
      endpoint: "https://$hostname;/instances/$tenantid;/v1/orchestrate/runs?limit=$first&offset=$after"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "Authorization", value: "Bearer $token" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo-guard"
      resultroot: "data[]"
      # pagination will do needful, but total is number of items
      # instead of pages.  Okay for now, but eventually
      # figure out how to translate this to number of pages.
      pagination: { type: OFFSET, setters: [{ field: "total", path: "total" }] }
    )
}

type Mutation {
  """
  Chat with an AI agent
  """
  createChatRun(
    llmvars: LLMParamsInput
    message: ChatMessageInput
    thread_id: ID
    guardrails: GuardrailsInput
  ): AssistantRunRoot
    @sequence(
      steps: [
        { query: "_accessToken" }
        {
          mutation: "_createChatRun"
          arguments: [
            # needed because non-zero step doesn't inherit arguments
            { name: "llmvars", argument: "llmvars" }
            { name: "message", argument: "message" }
            { name: "thread_id", argument: "thread_id" }
            { name: "guardrails", argument: "guardrails" }
          ]
        }
      ]
    )

  _createChatRun(
    llmvars: LLMParamsInput
    message: ChatMessageInput
    thread_id: ID
    guardrails: GuardrailsInput
    token: Secret
  ): AssistantRunRoot
    @rest(
      method: POST
      endpoint: "https://$hostname;/instances/$tenantid;/v1/orchestrate/runs"
      headers: [
        { name: "accept", value: "application/json" }
        { name: "Content-Type", value: "application/json" }
        { name: "Authorization", value: "Bearer $token" }
        { name: "IAM-API_KEY", value: "$apikey" }
      ]
      configuration: "wxo"
    )
}

type Subscription {
  """
  subscribe to run.  chatRunEvents will wait until stream_timeout before returning.   Shorten steamtime_out to get early results.

  note: last entry will have an error upon timeout
  """
  chatEvents(run_id: ID!, stream_timeout: Int): [RunEvent]
    @materializer(query: "chatRunEvents")
}
