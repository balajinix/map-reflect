type wxo_AccessToken {
  expired_in: Int
  token: String
  token_type: String
}

type wxo_ThreadConnection {
  edges: [wxo_ThreadEdge]
  pageInfo: PageInfo!
}

type wxo_ThreadEdge {
  cursor: String
  node: wxo_Thread
}

type wxo_Thread {
  additional_properties: wxo_AdditionalProperties
  assistant: wxo_AssistantInfo!
  "The message content, either as a list content objects or string."
  content: [JSON]!
  "The unique identifier of the user who created the message."
  created_by: String
  "The username of the user who created the message."
  created_by_username: String
  "The timestamp when the message was created."
  created_on: DateTime
  "The unique identifier of the message."
  id: ID!
  "List of mentions included in the message."
  mentions: [wxo_Mention]
  "The unique identifier of the parent message, if any."
  parent_message_id: ID
  "The role of the sender (Example: user and assistant)."
  role: String!
  "The tenant unique identifier associated with the message."
  tenant_id: ID!
  "The unique identifier of the thread the message belongs to."
  thread_id: ID!
  "The timestamp when the message was last updated."
  updated_at: DateTime
}

type wxo_AdditionalProperties {
  wxa_message: wxo_WxaMessage
}

type wxo_WxaMessage {
  output: wxo_WXAOutput
}

type wxo_WXAOutput {
  generic: [wxo_GenericEntry]
}

type wxo_GenericEntry {
  response_type: String
  text: String
}

type wxo_AssistantInfo {
  "The unique identifier of the AI assistant."
  assistant_id: ID
  "The name of the assistant."
  assistant_name: String
  "Indicates whether this is the default assistant."
  is_default: Boolean
}

type wxo_Mention {
  assistant_id: ID!
  assistant_name: String!
}

type wxo__CloudIBM {
  is_cloud_ibm: Boolean
}

type Query {
  wxo_threads(after: String = "", first: Int = 10): wxo_ThreadConnection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
