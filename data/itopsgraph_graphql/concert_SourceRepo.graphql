type SourceRepo {
  """Repository ID"""
  id: String!
  """Repository URL"""
  repo_url: String!
  """Name of the repository"""
  name: String!
  """Commit SHA"""
  commit_sha: String
  """Branch of repository"""
  branch: String
  """Cyclonedx link of repository"""
  cyclonedx_link: String
  """Tags of the repository"""
  tags: [TagsPrototype]!
  """Repository last updated time"""
  last_updated_on: Int!
  """Repository was last updated by"""
  last_updated_by: String!
  """Associations of the repository"""
  associations: RepositoryAssociations
}