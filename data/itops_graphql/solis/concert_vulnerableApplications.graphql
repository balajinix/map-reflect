type concert_VulnerableApplications {
  "Application ID"
  application_id: String
  "Cost information"
  cost: String
  "Number of CVEs"
  cves: Int
  "Number of impacted public APIs"
  impacted_public_api: Int
  "Risk score"
  risk_score: Float
}

type concert_VulnerableApplicationsCollection {
  "Top vulnerable applications"
  vulnerable_applications: [concert_VulnerableApplications]
}

type Query {
  concert_vulnerableApplications(
    token: Secret
  ): concert_VulnerableApplicationsCollection
