type Link {
  rel: String
  href: String
  hreflang: String
  media: String
  title: String
  type: String
  deprecation: String
  profile: String
  name: String
}

type Uuid {
  uuid: String
  displayName: String
  className: String
}

type EnvironmentType {
  environmentType: String
}

type RealtimeMarketReference {
  links: [Link]
  uuid: String
  displayName: String
  className: String
}

type Statistic {
  links: [Link]
  uuid: String
  displayName: String
  className: String
  date: String
  statistics: [StatisticDetail]
  epoch: String
}

type StatisticDetail {
  links: [Link]
  uuid: String
  displayName: String
  className: String
  name: String
  capacity: Capacity
  reserved: Reserved
  relatedEntityType: String
  filters: [Filter]
  relatedEntity: RealtimeMarketReference
  numRelatedEntities: Int
  units: String
  values: Values
  value: Float
  commoditySource: CommoditySource
  histUtilizations: [HistUtilization]
}

type Capacity {
  max: Float
  min: Float
  avg: Float
  total: Float
  totalMax: Float
  totalMin: Float
}

type Reserved {
  max: Float
  min: Float
  avg: Float
  total: Float
  totalMax: Float
  totalMin: Float
}

type Values {
  max: Float
  min: Float
  avg: Float
  total: Float
  totalMax: Float
  totalMin: Float
}

type CommoditySource {
  capacityCommoditySource: String
  usedCommoditySource: String
  capacitySourceIndex: Int
  usedSourceIndex: Int
}

type HistUtilization {
  type: String
  usage: Float
  capacity: Float
  resizeMaxScalingObservationPeriod: Int
  resizeScalingAggressiveness: Float
}

type StatsResponse {
  links: [Link]
  uuid: String
  displayName: String
  className: String
  environmentType: EnvironmentType
  realtimeMarketReference: RealtimeMarketReference
  stats: [Statistic]
}

type GetStatsQuery {
  stats: [StatsResponse]
}

type GetStatsByUuidsQuery {
  stats: [StatsResponse]
}
