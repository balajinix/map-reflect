extend type Query {
  """
  Gets the infrastructure topology
  Ex. GET api/infrastructure-monitoring/topology?includeData=true
  """
  topology(
    """Include snapshot data in nodes"""
    includeData: Boolean
  ): _topology_200_response
    @rest(
      endpoint: "https://$hostname;/api/infrastructure-monitoring/topology"
      method: GET
      headers: [
        { name: "authorization", value: "apitoken $apitoken;" }
      ]
      configuration: "instana-guard"
    )
}

type _topology_200_response {
  edges: [_query_topology_edges_items]
  nodes: [_query_topology_nodes_items]
}

type _query_topology_edges_items {
  """ID of the outgoing GraphEdge."""
  destination: String
  relation: _query_topology_edges_items_relation

  """ID of the incoming GraphEdge."""
  source: String
}

"""Type of dependency between the source and the destination."""
enum _query_topology_edges_items_relation {
  in
  is
  to
  of
  connected
  describes
  of20
  to20
  dummy
  parent
}

type _query_topology_nodes_items {
  data: JSON
  entityId: _query_topology_nodes_items_entityId

  """GraphNode ID."""
  id: String

  """Label of the entity"""
  label: String

  """Name of the plugin"""
  plugin: String
}

type _query_topology_nodes_items_entityId {
  host: String!

  """Plugin name"""
  pluginId: String!

  """Steady identifier for the entity."""
  steadyId: String!
}

