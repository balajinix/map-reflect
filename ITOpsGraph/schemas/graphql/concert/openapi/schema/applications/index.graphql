extend type Application {
  vulnerabilities: [Vulnerability!]
  @materializer(
     query: "applicationVulnerabilityDetails{ vulnerability_details }"
     arguments: [
        { name: "application_id", field: "id" }
     ]
  )
}

extend type Query {
  """
  specialized version of applicationVulnerabilityDetails that translates  application name to application_id because
  applicationVulnerabilityDetails does not consistently work on name.
  """
  applicationVulnerabilityDetailsByName(
    application_name: String!
    release_version: String

    # pagination later; data is encapsulated in collection but
    # there's no pagination information returned
    page_size: Int
    page_number: Int

    token: Secret
  ): VulnerabilityDetailsCollection
    @sequence(
      steps: [
        { query: "_convertApplicationName" }
        {
          query: "applicationVulnerabilityDetails"
          # needed since args are not passed through 
          arguments: [
            { name: "application_id", field: "id" }
            { name: "release_version", argument: "release_version" }
            { name: "page_size", argument: "page_size" }
            { name: "page_number", argument: "page_number" }
            { name: "token", argument: "token" }
          ]
        }
      ]
    )

  _convertApplicationName(
    token: Secret

    """
    application_name is used to filter applications
    """
    application_name: String
  ): [Application!]!
    @materializer(query: "_convertApplicationName0 { applications }")

  """
  specialized form of applications used to convert name to id - eventually replace with a call to applications
  """
  _convertApplicationName0(
    token: Secret

    page_size: Int
    page_number: Int
    """
    application_name is used to filter applications
    """
    application_name: String
  ): [Application!]!
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications?filter=name:$application_name"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
      resultroot: "applications"
    )

  """
  Returns a list of all application definitions in your Concert instance.
  Note that you will only see application IDs to which you have view access.
  """
  applications(
    """
    Authorization token
    """
    token: Secret
    """
    Maximum number of records or items to return in the response
    """
    page_size: Int
    """
    Number of records to skip from the beginning of the data set
    """
    page_number: Int
    """
    Sort by a column
    """
    sort_by: String
    """
    Sorting direction - no value or ascending(asc) or descending (desc)
    """
    sort_direction: SortDirection
    """
    Filter can consist of multiple values for the same field separated by comma (treated as OR)
    """
    filter: String
    """
    Search application name
    """
    search: String
  ): [Application!]!
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
      resultroot: "applications"
    )

  """
  Returns details about the application definition specified by its unique ID or name.
  """
  application(
    """
    Authorization token
    """
    token: Secret
    """
    Unique identifier of the application definition, can be both ID/name
    """
    application_id: String!
    """
    Resets all associations when set to true
    """
    remove_associations: Boolean
  ): Application
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Returns vulnerabilities impacting the application specified by its unique application definition ID or name.
  """
  applicationVulnerabilityDetails(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
    """
    Application release version
    """
    release_version: String
    """
    Maximum number of records or items to return in the response
    """
    page_size: Int
    """
    Number of records to skip from the beginning of the data set
    """
    page_number: Int
  ): [Vulnerability!]!
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/vulnerability_details"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
      resultroot: "vulnerability_details"
    )

  """
  Get vulnerabilities in an application
  """
  applicationVulnerabilities(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
    """
    Application release version
    """
    release_version: String
    """
    Severity
    """
    severity: String
    """
    Maximum number of records or items to return in the response
    """
    page_size: Int
    """
    Number of records to skip from the beginning of the data set
    """
    page_number: Int
    """
    Sort by a column
    """
    sort_by: String
    """
    Sorting direction - no value or ascending(asc) or descending (desc)
    """
    sort_direction: SortDirection
    """
    Filter can consist of multiple values for the same field separated by comma (treated as OR)
    """
    filter: String
    """
    Search cve name
    """
    search: String
  ): VulnerabilityCollection
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/vulnerabilities"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Get vulnerabilities summary for an application
  """
  applicationVulnerabilitiesSummary(
    """
    Authorization token
    """
    token: Secret
    """
    Unique ID of the application definition
    """
    application_id: String!
  ): VulnerabilitiesSummary
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/vulnerabilities_summary"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Get application summary
  """
  applicationsSummary(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
  ): AppComponentCount
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/applications_summary"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Get application revenue per hour
  """
  applicationRevenue(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
    """
    Release version of the application
    """
    release_version: String
  ): ApplicationReleaseProperties
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/revenue"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Get sboms of an application
  """
  applicationSboms(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
    """
    Application release version
    """
    release_version: String
    """
    Maximum number of records or items to return in the response
    """
    page_size: Int
    """
    Number of records to skip from the beginning of the data set
    """
    page_number: Int
    """
    Sort by a column
    """
    sort_by: String
    """
    Sorting direction - no value or ascending(asc) or descending (desc)
    """
    sort_direction: SortDirection
    """
    Search application name
    """
    search: String
  ): ApplicationSbomsCollection
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/sboms"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
        { name: "Authorization", value: "C_API_KEY $token" }
      ]
      configuration: "ibmConcert"
    )

  """
  Get application packages
  """
  applicationPackages(
    """
    Authorization token
    """
    token: Secret
    """
    This can be either the application name or the unique UUID of the application definition
    """
    application_id: String!
    """
    Application release version
    """
    release_version: String
    """
    Maximum number of records or items to return in the response
    """
    page_size: Int
    """
    Number of records to skip from the beginning of the data set
    """
    page_number: Int
    """
    Sort by a column
    """
    sort_by: String
    """
    Sorting direction - no value or ascending(asc) or descending (desc)
    """
    sort_direction: SortDirection
    """
    Filter can consist of multiple values for the same field separated by comma (treated as OR)
    """
    filter: String
    """
    Search cve name
    """
    search: String
  ): PackageDetailsCollection
    @rest(
      endpoint: "https://$hostname/core/api/v1/applications/$application_id/packages"
      headers: [
        { name: "InstanceId", value: "$instanceId" }
