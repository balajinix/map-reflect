"""chartevents contains all the charted data available for a patient."""
type mimic_CHARTEVENTS {
  "charttime records the time at which an observation was made, and is usually the closest proxy to the time the data was actually measured."
  charttime: String
  "storetime records the time at which an observation was manually input or manually validated by a member of the clinical staff."
  storetime: String
  "value contains the value measured for the concept identified by the itemid."
  value: String
  "valuenum contains the score and value contains the score and text describing the meaning of the score."
  valuenum: String
  "valueuom is the unit of measurement for the value, if appropriate."
  valueuom: String
  "warning specifies if a warning for the value was raised and if an error occurred during the measurement."
  warning: String
  "error specifies if a warning for the value was raised and if an error occurred during the measurement."
  error: String
  "resultstatus specifies the type of measurement."
  resultstatus: String
  "stopped specifies whether the measurement was stopped."
  stopped: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  charteventsList: [mimic_CHARTEVENTS]
  chartevents(id: ID!): mimic_CHARTEVENTS
}