syntax = "proto3";

package hashicorp.cloud.internal.infragraph.domain.v1;

import "google/protobuf/timestamp.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/model.proto";

option go_package = "github.com/hashicorp/cloud-infragraph/proto-internal/go;hashicorp_cloud_infragraph_internal";

message Resource {
  // witnessed_time is the time when this resource was last witnessed by the connector.
  // The same clock should be used universally within the scope of a single connector.
  google.protobuf.Timestamp witnessed_time = 1;

  // model is the domain model that represents this resource.
  Model model = 2;
}
