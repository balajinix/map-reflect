}

enum concert_SourceEntityType {
  ""
  image
  ""
  library
  ""
  repository
  ""
  resource
}

type Query {
  concert_vulnerabilities(
    filter: String
    page_number: Int
    page_size: Int
    search: String
    severity: String
    show_associations: String
    sort_by: String
    sort_direction: concert_SortDirection
  ): concert_VulnerabilityCollection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
