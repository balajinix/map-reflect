type concert_Cves {
  "CVE identifier"
  cve: String
  "Number of impacted public access points"
  impacted_public_access_points: Int
  "Priority classification"
  priority: String
  "Risk score"
  risk_score: Int
}

type concert_CvesPublicAccessPoints {
  "List of CVEs"
  cves: [concert_Cves]
  "CVE with highest risk"
  highest_risk: String
  "CVE with most impact"
  most_impact: String
}

type Query {
  concert_vulnerabilitiesAffectingPublicAccessPoints(
    token: Secret
  ): concert_CvesPublicAccessPoints
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
