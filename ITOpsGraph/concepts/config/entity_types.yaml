# Entity types for GLiNER2 extraction
#
# Two-pass extraction strategy:
# - Pass 1: Fine-grained extraction using GLiNER2
# - Pass 2: Hierarchy classification using LLM

# Pass 1: Fine-grained entities that GLiNER2 can reliably identify
fine_grained:
  # ITOps infrastructure resources
  itops_resources:
    - Metric
    - Alert
    - Policy
    - Action
    - Workload
    - Cluster
    - Container
    - Instance
    - Endpoint
    - Dashboard
    - Namespace
    - Node
    - Volume
    - Network

  # Technologies and tools
  technologies:
    - Service
    - Tool
    - Platform
    - Protocol
    - API
    - Framework
    - Database
    - Queue
    - Cache

  # Operational concepts
  operational:
    - Cost
    - SLA
    - Threshold
    - Configuration
    - Deployment
    - Pipeline
    - Release
    - Incident
    - Change

  # Cloud-specific
  cloud:
    - Region
    - Zone
    - Subnet
    - VPC
    - SecurityGroup
    - LoadBalancer
    - AutoScaler

# Pass 2: Hierarchy classification (LLM-assigned)
# These are broader categories for organizing entities
hierarchy:
  - Technology        # Technologies, tools, platforms
  - Feature           # Product capabilities
  - Capability        # Abstract functions
  - Resource          # Infrastructure components
  - Component         # System building blocks
  - Monitoring        # Observability concepts
  - Optimization      # Performance/cost concepts
  - Integration       # Cross-system concepts
  - Security          # Security-related concepts

# Mapping from fine-grained types to hierarchy (fallback if LLM unavailable)
type_to_hierarchy:
  # ITOps resources -> various
  Metric: Monitoring
  Alert: Monitoring
  Dashboard: Monitoring
  Policy: Resource
  Action: Capability
  Workload: Resource
  Cluster: Resource
  Container: Resource
  Instance: Resource
  Endpoint: Resource
  Namespace: Resource
  Node: Resource
  Volume: Resource
  Network: Resource

  # Technologies
  Service: Technology
  Tool: Technology
  Platform: Technology
  Protocol: Technology
  API: Integration
  Framework: Technology
  Database: Technology
  Queue: Technology
  Cache: Technology

  # Operational
  Cost: Optimization
  SLA: Monitoring
  Threshold: Monitoring
  Configuration: Resource
  Deployment: Capability
  Pipeline: Integration
  Release: Capability
  Incident: Monitoring
  Change: Capability

  # Cloud
  Region: Resource
  Zone: Resource
  Subnet: Resource
  VPC: Resource
  SecurityGroup: Security
  LoadBalancer: Resource
  AutoScaler: Optimization
