"""Available filters for CVEs"""
type CVEFilters {
  """Priority filters"""
  highest_finding_priority: [String]
  """Scan type filters"""
  scan_type: [String]
  """Unassessed findings filters"""
  has_unassessed_findings: [Boolean]
  """Exception requested filters"""
  has_exceptions_requested: [Boolean]
  """Open tickets filters"""
  has_open_tickets: [Boolean]
  """Application filters"""
  application: [ApplicationDetails]
}