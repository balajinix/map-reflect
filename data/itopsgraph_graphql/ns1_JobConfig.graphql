"""Pulsar job details"""
type JobConfig {
  """Hostname where the resource to be measured is located"""
  host: String
  """URL path to be appended to the host"""
  url_path: String
  """use HTTP in measurements"""
  http: Boolean
  """use HTTPS in measurements"""
  https: Boolean
  """Maximum timeout per request"""
  request_timeout_millis: Int
  """Maximum timeout per job"""
  job_timeout_millis: Int
  """Whether to use XHR when taking measurements"""
  use_xhr: Boolean
  """Whether to skip aggregation for this job's measurements"""
  static_values: Boolean
  """metrics weights"""
  blend_metric_weights: JSON
}