type concert_IDNamePair {
  "ID"
  id: String
  "Name"
  name: String
}

type concert_MostVulnerableApplicationCollection {
  "List of most vulnerable applications"
  applications: [concert_MostVulnerableApplication]
  "Application with most priority 1 findings"
  most_priority_1_findings: concert_IDNamePair
  "Application with most total findings"
  most_total_findings: concert_IDNamePair
}

type concert_MostVulnerableApplication {
  "Application ID"
  id: String
  "Application name"
  name: String
  "Count of priority 1 findings"
  priority_1_findings: Int
  "Count of priority 2 findings"
  priority_2_findings: Int
  "Count of priority 3 findings"
  priority_3_findings: Int
}

type Query {
  concert_mostVulnerableApplications(
    token: Secret
  ): concert_MostVulnerableApplicationCollection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
