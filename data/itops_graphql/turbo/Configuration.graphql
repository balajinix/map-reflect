# """
# Get SaaS Reporting Configuration
# """
type GetSaaSReportingConfiguration {
  """
  SaaS Reporting Encoded Configuration
  """
  configuration: String!

  """
  SaaS Reporting Configuration Information
  """
  enabled: String!
}

# """
# Set SaaS Reporting Configuration
# """
type SetSaaSReportingConfiguration {
  """
  SaaS Reporting Encoded Configuration
  """
  configuration: String!

  """
  SaaS Reporting Configuration Information
  """
  enabled: String!
}

# """
# Delete SaaS Reporting Configuration
# """
type DeleteSaaSReportingConfiguration {
  """
  No fields are returned as this operation is a mutation.
  """
  success: Boolean!
}

type Query {
  # Get the reporting configuration
  getSaasReportingConfiguration(
    @rest(
      method: "GET",
      path: "Getsaasreportingconfiguration"
    )
  ): GetSaaSReportingConfiguration

  # Configure reporting
  setSaasReportingConfiguration(
    @rest(
      method: "POST",
      path: "Setsaasreportingconfiguration"
    )
  ): SetSaaSReportingConfiguration

  # Delete the reporting configuration
  deleteSaasReportingConfiguration(
    @rest(
      method: "POST",
      path: "Deletesaasreportingconfiguration"
    )
  ): DeleteSaaSReportingConfiguration
}
