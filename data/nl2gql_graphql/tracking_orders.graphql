type Customers {
  customer_details: String
  customer_id: ID!
  customer_name: String
  orders: [Orders] @materializer(query: "ordersUsingOrders_customer_id_fkey")
}

type Invoices {
  invoice_date: DateTime
  invoice_details: String
  invoice_number: ID!
  shipments: [Shipments]
    @materializer(query: "shipmentsUsingShipments_invoice_number_fkey")
}

type Order_items {
  order_id: ID
  order_item_details: String
  order_item_id: ID!
  order_item_status: String
  orders: Orders @materializer(query: "ordersUsingOrder_items_order_id_fkey")
  product_id: ID
  products: Products
    @materializer(query: "productsUsingOrder_items_product_id_fkey")
  shipments: [Shipments] @materializer(query: "shipmentsViaShipment_items")
}

type Orders {
  customer_id: ID
  customers: Customers
    @materializer(query: "customersUsingOrders_customer_id_fkey")
  date_order_placed: DateTime
  order_details: String
  order_id: ID!
  order_items: [Order_items]
    @materializer(query: "order_itemsUsingOrder_items_order_id_fkey")
  order_status: String
  shipments: [Shipments]
    @materializer(query: "shipmentsUsingShipments_order_id_fkey")
}

type Products {
  order_items: [Order_items]
    @materializer(query: "order_itemsUsingOrder_items_product_id_fkey")
  product_details: String
  product_id: ID!
  product_name: String
}

type Shipments {
  invoice_number: ID
  invoices: Invoices
    @materializer(query: "invoicesUsingShipments_invoice_number_fkey")
  order_id: ID
  order_items: [Order_items]
    @materializer(query: "order_itemsViaShipment_items")
  orders: Orders @materializer(query: "ordersUsingShipments_order_id_fkey")
  other_shipment_details: String
  shipment_date: DateTime
  shipment_id: ID!
  shipment_tracking_number: String
}

