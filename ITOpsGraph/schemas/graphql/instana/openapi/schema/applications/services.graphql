extend type Query {
  _instana_application_service(
    first: Int! = 10
    filter: ApplicationServiceFilter
    id: ID!
    to: String!
    windowSize: String!
  ): [ApplicationService]
    @materializer(
      query: "_instana_getApplicationServices"
      arguments: [{ name: "label", argument: "filter.label.eq" }]
    )

  # https://instana.github.io/openapi/#operation/getApplicationServices
  _instana_getApplicationServices(
    first: Int! = 10
    label: String! = ""
    id: ID!
    to: String!
    windowSize: String!
  ): [ApplicationService]
    @rest(
      endpoint: "https://$hostname;/api/application-monitoring/applications;id=$id;/services?page=1&pageSize=$first;&to=$to;&windowSize=$windowSize&nameFilter=$label;"
      method: GET
      headers: [{ name: "authorization", value: "apitoken $apitoken;" }]
      ecmascript: """
      function transformREST(s) {
        let service = JSON.parse(s);
        service._appid = get('id');
        service._to = get('to');
        service._windowSize = get('windowSize');
        return JSON.stringify(service);
      }
      """
      setters: [
        { field: "entityType", path: "items[].entityType" }
        { field: "id", path: "items[].id" }
        { field: "label", path: "items[].label" }
        { field: "technologies", path: "items[].technologies" }
        { field: "types", path: "items[].types" }
      ]
      configuration: "instana"
    )
}

"""
Application service.
"""
type ApplicationService implements Entity {
  entityType: EntityType

  """
  Unique ID of the Service. Eg: 3feb3dcd206c166ef2b41c707e0cd38d7cd325aa
  """
  id: ID!

  """
  Name of the Service. Eg: payment.
  """
  label: String!

  """
  List of technologies: Eg: `["springbootApplicationContainer"]`
  """
  technologies: [String]

  """
  Types of endpoints the service consists of.
  """
  types: [ServiceType]

  # internal fields to maintain search capability down the graph (application->service->endpoint)
  _appid: ID!
  _to: String!
  _windowSize: String!
}

extend type ApplicationPerspective {
  """
  Services.
  """
  services(
    first: Int! = 10
    filter: ApplicationServiceFilter
  ): [ApplicationService]
    @materializer(
      query: "_instana_application_service"
      arguments: [
        { name: "first", argument: "first" }
        { name: "filter", argument: "filter" }
      ]
    )
}

enum ServiceType {
  UNDEFINED
  RPC
  EVENT
  GRAPHQL
  BATCH
  SHELL
  HTTP
  SDK
  OPENTELEMETRY
  INTERNAL
  DATABASE
  MESSAGING
  PAGE
  PAGE_RESOURCE
}

input ApplicationServiceFilter {
  label: NameFilter
}
