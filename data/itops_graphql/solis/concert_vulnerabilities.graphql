  "Comment"
  comment: String
  "Component ID"
  component_id: String
  "Component type"
  component_type: concert_ComponentType
  "Custom score"
  custom_score: Float
  "CVE identifier"
  cve: String
  "CVSS score"
  cvss: Float
  "Deprioritized findings count"
  deprioritized_findings: Int
  "Vulnerability description"
  description: String
  "Exceptions requested count"
  exceptions_requested: Int
  "Exception requested status"
  exceptions_requested_count: String
  "Vulnerability findings"
  findings: [concert_VulnerabilityAssociationComponent]
  "Whether exceptions have been requested"
  has_exceptions_requested: Boolean
  "Whether there are open tickets"
  has_open_tickets: Boolean
  "Whether there are unassessed findings"
  has_unassessed_findings: Boolean
  "Highest finding priority"
  highest_finding_priority: String
  "Highest finding risk score"
  highest_finding_risk_score: Int
  "Open tickets count"
  open_tickets: Int
  "OSV response message"
  osv_response_message: String
  "Package name"
  package_name: String
  "Package type"
  package_type: String
  "Package version"
  package_version: String
  "Priority 1 findings count"
  priority_1_findings: Int
  "Priority 2 findings count"
  priority_2_findings: Int
  "Priority 3 findings count"
  priority_3_findings: Int
  "Related CVEs"
  related_cves: [String]
  "Severity level"
  severity: String
  "State of the assessment"
  state: concert_AssessmentState
  "Total findings count"
  total_findings: Int
  "Number of unassessed findings"
  unassessed_findings: Int
  "CVSS vector string"
  vector: String
  "Vulnerability findings ID"
  vulnerability_findings_id: String
}

type concert_VulnerabilityAssociations {
  "Associated build artifacts"
  build_artifacts: [concert_AssociatedBuildArtifacts]
}

type concert_AssociatedBuildArtifacts {
  "Digest of the artifact"
