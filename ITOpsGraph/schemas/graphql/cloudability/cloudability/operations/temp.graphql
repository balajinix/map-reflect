query GetTopServicesByCost($startDate: String!, $endDate: String!) {
  llmFriendlyCostReport(
    dateRange: {
      start: $startDate
      end: $endDate
    }
    dimensions: [ENHANCED_SERVICE_NAME]
    metrics: [UNBLENDED_COST]
    sort: [
      {
        field: "unblendedCost"
        direction: "DESC"
      }
    ]
    limit: 5
  ) {
    results {
      enhanced_service_name
      unblended_cost
    }
    total_results
  }
}
