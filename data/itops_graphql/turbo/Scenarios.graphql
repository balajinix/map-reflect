  tags: String
  onDemandRateBefore: String
  onDemandRateAfter: String
}

type Query {
  getScenarios: [GetScenario!]!
  createScenario(input: CreateScenarioInput!): Createscenario
  getScenarioByName(input: GetScenarioByNameInput!): GetScenarioByName
  configureScenario(input: ConfigureScenarioInput!): ConfigureScenario
  deleteScenario(input: DeletescenarioInput!): Deletescenario
  configureEntities(input: ConfigureEntitiesInput!): ConfigureEntities
  deleteEntities(input: DeleteEntitiesInput!): DeleteEntities
  configureGroups(input: ConfigureGroupsInput!): ConfigureGroups
  getMarketsByScenario(input: GetMarketsByScenarioInput!): GetMarketsByScenario
  addScenarioPolicy(input: AddScenarioPolicyInput!): AddScenarioPolicy
  deleteScenarioPolicy(input: DeletescenariopolicyInput!): Deletescenariopolicy
  addScenarioTemplate(input: AddScenariotemplateInput!): AddScenariotemplate
}

