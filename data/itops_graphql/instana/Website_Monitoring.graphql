# """
# Type representing a Beacon Group
# """
type GetBeaconGroup {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String!
}

# """
# Type representing a Beacon
# """
type GetBeacon {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String!
  beaconGroupId: ID!
}

# """
# Type representing a Website Tag Catalog
