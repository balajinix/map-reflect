query GetEC2Recommendations {
  recommendationsEC2 {
    meta {
      totalCount
      aggregates {
        basis
        cost
        idleSavings
        optimizedSavings
        rightsizeSavings
      }
    }
    result {
      name
      resourceIdentifier
      nodeType
      instanceFamily
      provider
      region
      availabilityZone
      accountName
      vendorAccountId
      service
      os
      currencyCode
      totalSpend
      unitPrice
      daysInactive
      hoursRunning
      idle
      snoozed
      snoozeExpiresOn
      cpuCapacity
      cpuMax
      memoryCapacity
      memoryMax
      networkCapacity
      gpuCapacity
      gpuMax
      gpuMemoryCapacity
      gpuMemoryMax
      localCapacity
      localDrives
      tenancy
      lastSeen
      minInstanceCount
      maxInstanceCount
      tagMappings {
        tag
        tagName
        vendorTagValue
      }
      recommendations {
        nodeType
        instanceFamily
        action
        savings
        savingsPct
        unitPrice
        risk
        cpuRisk
        memoryRisk
        networkRisk
        diskRisk
        currentGen
        sameFamily
        sameMemory
        cpuCapacity
        memoryCapacity
        networkCapacity
        gpuCapacity
        gpuMemoryCapacity
        localCapacity
        cpuRatio
        memoryRatio
        networkRatio
        gpuRatio
        gpuMemoryRatio
        memoryFit
        inDefaults
        defaultsOrder
        preferenceOrder
      }
    }
  }
}