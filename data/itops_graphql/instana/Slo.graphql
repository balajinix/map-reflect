# """
# Represents a GetSlo object which contains information about a Service Level Objective (SLO)
# """
type Getslo {
  """
  The unique identifier for the GetSlo
  """
  id: ID!

  """
  The name of the SLO
  """
  name: String!

  """
  The target value for the SLO (e.g., 99.9%)
  """
  target: Float!

  """
  The period for which the SLO is calculated (e.g., day, week, month)
  """
  period: String!

  """
  The status of the SLO (e.g., PASS, WARNING, FAIL)
  """
  status: String!

  """
  The last checked timestamp for the SLO
  """
  lastChecked: String

  """
  The violation count for the SLO
  """
  violationCount: Int

  """
  The violation percent for the SLO
  """
  violationPercent: Float

  """
  The error message if the SLO is in FAIL status
  """
  errorMessage: String
}

type Query {
  # Retrieve a single GetSlo by its ID
  getsloById(id: ID!): Getslo

  # Retrieve multiple Getslo objects
  getslos: [Getslo!]!
}

