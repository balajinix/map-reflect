"""procedures_icd contains icd procedures for patients, most notably icd-9 procedures."""
type mimic_PROCEDURES_ICD {
  "seq_num provides the order in which the procedures were performed."
  seq_num: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  procedures_icdList: [mimic_PROCEDURES_ICD]
  procedures_icd(id: ID!): mimic_PROCEDURES_ICD
}