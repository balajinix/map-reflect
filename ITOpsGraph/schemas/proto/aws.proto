syntax = "proto3";

package hashicorp.cloud.internal.infragraph.domain.v1;

import "google/protobuf/timestamp.proto";
import "hashicorp/cloud/internal/infragraph/domain/v1/base.proto";
import "hashicorp/cloud/internal/infragraph/options/v1/options.proto";

option go_package = "github.com/hashicorp/cloud-infragraph/proto-internal/go;hashicorp_cloud_infragraph_internal";

// AwsResource is a type containing AWS specific fields.
message AwsResource {
  option (options.v1.message_include) = true;
  option (options.v1.message_properties_only) = true;
  option (options.v1.message_source) = "AWS";

  string arn = 2;
}

message AwsIamPolicy {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BasePolicy policy = 1;
  AwsResource aws_resource = 2;

  optional int32 attachment_count = 3;
}

message AwsIamUser {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseUser user = 1;
  AwsResource aws_resource = 2;
}

message AwsIamRole {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseRole role = 1;
  AwsResource aws_resource = 2;
  string path = 3;
  optional string assume_role_policy_document = 4;
  optional string description = 5;
  optional int32 max_session_duration = 6;
  optional google.protobuf.Timestamp last_used_date = 7;
  optional string last_used_region = 8;
  optional string permissions_boundary_arn = 9;
  optional string permissions_boundary_type = 10;
}

message AwsIamRolePolicyAttachment {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";
  option (options.v1.message_kind) = "ROLE_POLICY_ATTACHMENT";

  Base base = 1;
  AwsResource aws_resource = 2;

  string policy_arn = 3 [
    (options.v1.edge_label) = "ATTACHES_TO",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "POLICY"
  ];
  string role_name = 4;
  string role_id = 5 [
    (options.v1.edge_label) = "ATTACHES_TO",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "ROLE"
  ];
}

message AwsNetworkInterface {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseNetworkInterface network_interface = 1;
  AwsResource aws_resource = 2;
}

message AwsRegion {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseRegion region = 1;
  AwsResource aws_resource = 2;
}

message AwsSecurityGroup {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseSecurityGroup security_group = 1;
  AwsResource aws_resource = 2;
}

message AwsSecurityGroupRule {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseSecurityRule security_rule = 1;
  AwsResource aws_resource = 2;
}

message AwsAvailabilityZone {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseZone zone = 1;
  AwsResource aws_resource = 2;
}

// AwsEc2Instance domain model message.
message AwsEc2Instance {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseVirtualMachine virtual_machine = 1;
  AwsResource aws_resource = 2;

  optional string tenancy = 3;
  optional string private_ip = 4;
  optional bool monitoring = 5;
}

message AwsEc2Volume {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseVolume volume = 1;
  AwsResource aws_resource = 2;
}

message AwsAmi {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseVirtualMachineImage virtual_machine_image = 1;
  AwsResource aws_resource = 2;
}

message AwsEcsCluster {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";
  option (options.v1.message_kind) = "ECS_CLUSTER";

  Base base = 1;
  AwsResource aws_resource = 2;
}

message AwsEcsService {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";
  option (options.v1.message_kind) = "ECS_SERVICE";

  Base base = 1;
  AwsResource aws_resource = 2;

  string cluster_id = 3 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "ECS_CLUSTER"
  ];

  repeated string subnet_ids = 4 [
    (options.v1.edge_label) = "CONTAINS",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "SUBNET"
  ];
}

message AwsSubnet {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseSubnet subnet = 1;
  AwsResource aws_resource = 2;
}

message AwsVpc {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseVpc vpc = 1;
  AwsResource aws_resource = 2;
}

message AwsS3Bucket {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseStorageBucket storage_bucket = 1;
  AwsResource aws_resource = 2;

  // TODO: the original transformer implementation extracted
  // BucketEncryption.ServerSideEncryptionConfiguration[0].BucketKeyEnabled and
  // BucketEncryption.ServerSideEncryptionConfiguration[0].SSEAlgorithm as
  // encryptionKeyEnabled and encyptionDefaultAlgorithm fields. Deferring this
  // unitl these fields more generically modelled across CSPs if possible.
}

message AwsLambdaFunction {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseServerlessFunction serverless_function = 1;
  AwsResource aws_resource = 2;

  string description = 3;
  string role = 4;
  int32 memory_size = 5;
  string run_time = 6;
  repeated string architectures = 7;

  repeated string subnet_ids = 8 [
    (options.v1.edge_label) = "CONNECTS_TO",
    (options.v1.edge_direction) = "OUTGOING",
    (options.v1.node_label) = "SUBNET"
  ];

  repeated string security_group_ids = 9 [
    (options.v1.edge_label) = "APPLIES_TO",
    (options.v1.edge_direction) = "INCOMING",
    (options.v1.node_label) = "SECURITY_GROUP"
  ];
}

message AwsAccount {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseAccount account = 1;
  AwsResource aws_resource = 2;
}

message AwsEc2InstanceType {
  option (options.v1.message_include) = true;
  option (options.v1.message_source) = "AWS";

  BaseVirtualMachineType virtual_machine_type = 1;
  AwsResource aws_resource = 2;
}
