input ReturnOptionsInput {
  # TextGenerationReturnOptions
  generated_tokens: Boolean
  input_parameters: Boolean
  input_text: Boolean
  input_tokens: Boolean
  token_logprobs: Boolean
  token_ranks: Boolean
  """
  Include top N candidate tokens at the position of each returned token. The maximum value that is permitted is 5, but more might be returned if there is a tie for nth place.
  """
  top_n_tokens: Int
}

input LengthPenaltyInput {
  """
  Represents the factor of exponential decay. Larger values correspond to more aggressive decay.
  """
  decay_factor: Float
  """
  A number of generated tokens after which this should take effect.
  """
  start_index: Int
}

input LLMParamsInput {
  """
  Specifies the number of beams that are used in beam search decoding. A higher value allows for a more exhaustive search, potentially improving the quality of the output at the cost of computational complexity.
  """
  beam_width: Int

  """
  Represents the strategy that is used for picking the tokens during generation of the output text. Possible values include 'greedy' for deterministic generation and 'sample' for stochastic generation.
  """
  decoding_method: String

  """
  Pass `false` to omit matched stop sequences from the end of the output text. The default is `true`, meaning that the output ends with the stop sequence text when matched.
  """
  include_stop_sequence: Boolean

  """
  It can be used to exponentially increase the likelihood of the text generation terminating once a specified number of tokens have been generated.
  """
  length_penalty: LengthPenaltyInput

  """
  The maximum number of new tokens to be generated. It limits the length of the generated output, preventing it from exceeding a specified size.
  """
  max_new_tokens: Int

  """
  If stop sequences are given, they are ignored until minimum tokens are generated.
    The minimum number of new tokens to be generated.
  """
  min_new_tokens: Int

  """
  Random number generator seed to use in sampling mode for experimental repeatability.
  """
  random_seed: Int

  """
  Represents the penalty for penalizing tokens that have already been generated or belong to the context. The value 1.0 means that there is no penalty.
  """
  repetition_penalty: Float

  return_options: ReturnOptionsInput

  """
  Stop sequences are one or more strings which will cause the text generation to stop if/when they are produced as part of the output.
  """
  stop_sequences: [String]

  """
  A value used to modify the next-token probabilities in sampling mode. Values less than 1.0 sharpen the probability distribution, resulting in \"less random\" output. Values greater than 1.0 flatten the probability distribution, resulting in \"more random\" output. A value of 1.0 has no effect.
  """
  temperature: Float

  """
  Time limit in milliseconds - if not completed within this time, generation stops. The text generated so far is returned along with the TIME_LIMIT stop reason.
  """
  time_limit: Int

  """
  The number of highest probability vocabulary tokens to keep for top-k-filtering. Only applies for sampling mode. When decoding_strategy is set to sample, only the top_k most likely tokens are considered as candidates for the next generated token.
  """
  top_k: Int

  """
  Similar to top_k except the candidates to generate the next token are the most likely tokens with probabilities that add up to at least top_p. Also known as nucleus sampling. A value of 1.0 is equivalent to disabled.
  """
  top_p: Float
  """
  Truncates the input to a specified number of tokens to prevent exceeding token limits, which may cause request failures.
  """
  truncate_input_tokens: Int
  """
  Measures typicality to control how predictable the next token is compared to the expected randomness. Lower values lead to more diverse outputs.
  """
  typical_p: Float
}

input ChatMessageTextInput {
  """
  search, text, user_defined
