extend type Query {
  applicationMetrics(
    first: Int! = 10
    after: String! = ""
    filter: ApplicationFilter!
  ): ApplicationConnection
    @sequence(
      steps: [
        { query: "_instana_am_postbody" }
        {
          query: "_instana_applicationMetrics"
          arguments: [
            { name: "first", argument: "first" }
            { name: "after", argument: "after" }
            { name: "_input", field: "§0" }
          ]
        }
      ]
    )

  _instana_am_postbody(filter: ApplicationFilter!): JSON
    @value(
      script: {
        language: JSONATA
        src: """
        {
          "applicationBoundaryScope": filter.boundaryScope.eq,
          "contextScope": "NONE",
          "metrics": [
            {
              "aggregation": "mean",
              "metric": "latency"
            }
          ],
          "order": {
            "by": "latency.mean",
            "direction": "DESC"
          },
          "timeFrame": {
            "to": $string($toMillis(filter.timeFrame.le)),
            "windowSize": $string($toMillis(filter.timeFrame.le) - $toMillis(filter.timeFrame.ge))
          }
        }
        """
      }
    )
  _instana_applicationMetrics(
    first: Int! = 10
    after: String! = ""
    _input: JSON! # """ # If enabled, fill the missing data points in the metric result with timestamp and value 0. # """ # fillTimeSeries: Boolean
  ): ApplicationConnection
    @rest(
      endpoint: "https://$hostname;/api/application-monitoring/metrics/applications?fillTimeSeries=true"
      method: POST
      postbody: """
      {
        "applicationBoundaryScope": "{{.Get "_input.applicationBoundaryScope" }}",
        "contextScope": "{{.Get "_input.contextScope" }}",
        "metrics": {{.GetJSON "_input.metrics" }},
        "order": {{.GetJSON "_input.order" }},
        "pagination": {  "pageSize": {{(.Get "first") }}, "page": {{(.Get "after") }} },
        "timeFrame": {{.GetJSON "_input.timeFrame" }}
      }
      """
      headers: [{ name: "authorization", value: "apitoken $apitoken;" }]
      resultroot: "items[].application"
      pagination: {
        type: PAGE_NUMBER
        # total hits seems to be edge count, not pages.
        setters: [{ field: "total", path: "totalHits" }]
      }
      configuration: "instana-guard"
    )
}

extend type Query {
  applications(
    first: Int! = 10
    after: String! = ""
    filter: ApplicationFilter!
  ): ApplicationConnection
    @sequence(
      steps: [
        {
          query: "_timeframe"
          arguments: { name: "frame", argument: "filter.timeFrame" }
        }
        {
          query: "_instana_getApplications"
          arguments: [
            { name: "first", argument: "first" }
            { name: "after", argument: "after" }
            { name: "nameFilter", argument: "filter.label.eq" }
            {
              name: "applicationBoundaryScope"
              argument: "filter.boundaryScope.eq"
            }
          ]
        }
      ]
    )
  """
  https://instana.github.io/openapi/#operation/getApplications
  """
  _instana_getApplications(
    first: Int! = 10
    after: String! = ""
    nameFilter: String
    to: String!
    windowSize: String!
    applicationBoundaryScope: BoundaryScope!
  ): ApplicationConnection
    @rest(
      endpoint: "https://$hostname;/api/application-monitoring/applications?page=$after;&pageSize=$first;&to=$to;&windowSize=$windowSize;&applicationBoundaryScope=$applicationBoundaryScope;"
      method: GET
      headers: [{ name: "authorization", value: "apitoken $apitoken;" }]
      # resultroot: "items[]"
      pagination: {
        type: PAGE_NUMBER
        # total hits seems to be edge count, not pages.
        setters: [{ field: "total", path: "totalHits" }]
      }
      setters: [
        { field: "to", path: "adjustedTimeframe.to" }
        { field: "windowSize", path: "adjustedTimeframe.windowSize" }
        { field: "id", path: "items[].id" }
        { field: "label", path: "items[].label" }
        { field: "entityType", path: "items[].entityType" }
        { field: "boundaryScope", path: "items[].boundaryScope" }
      ]
      configuration: "instana"
    )
}

extend type Query {
  """
  You can use the callGroup field to fetch time series metrics such as the highest latency, the top erroneous calls, 
  rates, total number of calls, that are handled by some specific application and then you can group by things like 
  service name, endpoint name, HTTP call path or URL.
  """
  callGroup(
    """
    If enabled, fill the missing data points in the metric result with timestamp and value 0.
    """
    fillTimeSeries: Boolean
    input: callGroup_request
  ): callGroup_200_response
    @rest(
      endpoint: "https://$hostname;/api/application-monitoring/analyze/call-groups"
      method: POST
      postbody: """
      {{.GetJSON "input"}}
      """
      headers: [
        { name: "authorization", value: "apitoken $apitoken;" }
      ]
      configuration: "instana-guard"
    )
}

type callGroup_200_response {
  adjustedTimeframe: callGroup_adjustedTimeframe

  """
  Determine if additional data is available when a new query is made using the cursor from the last item in the `items` list.
  """
  canLoadMore: Boolean

  """
  Represents an array of call group item containing several attributes that describe its properties.
  The item includes fields such as cursor, metrics, name, and timestamp, which provide detailed information about the item.
  """
  items: [callGroup_items_items]!

  """The total number of items that match a given filter"""
  totalHits: BigInt

  """
  For calls and EUM beacons, one row can represent multiple real items (batched call, sample multiplicity)
  """
  totalRepresentedItemCount: BigInt

  """
  For calls and EUM beacons, only a subset is retained for historic data. Each retained row can represent multiple real items due to batching.
  """
  totalRetainedItemCount: BigInt
}

"""
Time frame provided in API request is slightly adjusted in response for faster API response.
For example, In request payload, if timeframe is 08:03 - 14:03, which is a 6 hour window size. It is adjusted to 08:05 - 14:00
Another example, In request payload, if timeframe is 08:20 - 08:20 (next day) which is a 24h window size. It is adjusted to 08:30 - 08:00 (next day)
"""
type callGroup_adjustedTimeframe {
  """
  end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.
  """
  to: BigInt!

  """windowSize in milliseconds"""
  windowSize: BigInt
}

"""
Represents an array of call group item containing several attributes that describe its properties.
The item includes fields such as cursor, metrics, name, and timestamp, which provide detailed information about the item.
"""
type callGroup_items_items {
  cursor: JSON!

  """
  Grouped metric details like `errors.mean`, `calls.sum`.
  It is usually a array of key-value pair. Format of key is `metric.aggregation.granularity`, for example: `latency.p75.360`.
  Format of value is `[earliest timestamp, value of key]`, for example: `[1725602720000, 0.013141001434936938]`.
  """
  metrics: JSON!

  """Name of the group."""
  name: String!

  """Earliest timestamp of the call from the group"""
  timestamp: BigInt
}

input callGroup_request {
  group: callGroup_input_group!

  """
  Flag to include Internal Calls. These calls are work done inside a service and correspond to intermediate spans in custom tracing.
  """
  includeInternal: Boolean

  """
  Flag to include Synthetic Calls. These calls have a synthetic endpoint as their destination, such as calls to health-check endpoints.
  """
  includeSynthetic: Boolean

  """
  A list of objects each of which defines a metric and the (statistical) aggregation -- MEAN, SUM, MAX, etc -- that should be used to summarize it for the defined time frame. Eg: `[{ 'metric': 'latency', 'aggregation': 'MEAN'}]`. To know more about supported metrics and its aggregation, See `Get Metric catalog`.
  """
  metrics: [callGroup_input_metrics_items]!
  order: callGroup_input_order
  pagination: callGroup_input_pagination
  tagFilterExpression: tagFilterExpressionElement_Input
  timeFrame: callGroup_input_timeFrame
}

"""
Grouping of data under `groupbyTag`, where `groupbyTagEntity` and `groupbyTagSecondLevelKey` are aspects of `groupbyTag`.
"""
input callGroup_input_group {
  """The name of the group tag (e.g. `agent.tag` or `docker.label`)."""
  groupbyTag: callGroup_input_group_groupbyTag!
  groupbyTagEntity: callGroup_input_group_groupbyTagEntity!

  """
  If present, it's the 2nd level key part (e.g. `customKey` on `docker.label.customKey`)
  """
  groupbyTagSecondLevelKey: callGroup_input_group_groupbyTagSecondLevelKey
}

"""The name of the group tag (e.g. `agent.tag` or `docker.label`)."""
scalar callGroup_input_group_groupbyTag

"""
The entity by which the data should be grouped.
This field supports three possible values: `NOT_APPLICABLE`, `DESTINATION`, and `SOURCE`.
`SOURCE`: the tag filter should apply to the source entity.
`DESTINATION`: the tag filter should apply to the destination entity.
`NOT_APPLICABLE`: some tags are independent of source or destination, such as tags on the call itself, log tags or trace tags (only destination makes sense because the source is unknown for the root call).
"""
enum callGroup_input_group_groupbyTagEntity {
  NOT_APPLICABLE
  DESTINATION
  SOURCE
}

"""
If present, it's the 2nd level key part (e.g. `customKey` on `docker.label.customKey`)
"""
scalar callGroup_input_group_groupbyTagSecondLevelKey

"""
A list of objects each of which defines a metric and the (statistical) aggregation -- MEAN, SUM, MAX, etc -- that should be used to summarize it for the defined time frame. Eg: `[{ 'metric': 'latency', 'aggregation': 'MEAN'}]`. To know more about supported metrics and its aggregation, See `Get Metric catalog`.
"""
input callGroup_input_metrics_items {
  aggregation: callGroup_input_metrics_items_aggregation!

  """
  If the granularity is set you will get data points with the specified granularity in seconds. Default: `1000` milliseconds
  """
  granularity: Int

  """Set a particular metric, eg: `latency`."""
  metric: String!
}

"""Set aggregation that can be applied to a series of values. Eg: `MEAN`."""
enum callGroup_input_metrics_items_aggregation {
  SUM
  MEAN
  MAX
  MIN
  P25
  P50
  P75
  P90
  P95
  P98
  P99
  P99_9
  P99_99
  DISTINCT_COUNT
  SUM_POSITIVE
  PER_SECOND
  INCREASE
}

"""
Specifies the ordering of the results.
It contains fields that define the sorting criteria, the collation for sorting, and the direction in which the results should be ordered.
"""
input callGroup_input_order {
  """
  If the granularity is set to `1` you can use the metric name eg. `latency.p95` to order by that value.
  """
  by: String!

  """Language code used for sorting. Ignored for infrastructure queries."""
  collation: String
  direction: callGroup_input_order_direction!
}

"""
Details for controlling the pagination of the API response.
This object allows you to define the starting point for retrieving records, how many records to skip, and the size of the result set.
"""
input callGroup_input_pagination {
  """
  The timestamp indicating the starting point from which data was ingested.
  The format of the timestamp is in Unix epoch Time.
  For example, `Thursday, 5 September 2024 07:03:13 GMT` can be represented as `1725519793`.
  """
  ingestionTime: BigInt

  """
  The number of records to be skipped from the `ingestionTime`.
  For example: when `offset` is 20 and `ingestionTime` is 1725519793, the API response should have records starting from the 21st record after the specified `ingestionTime`.
  Note that if `offset` value is not empty, `ingestionTime` can't be empty.
  """
  offset: Int

  """
  The number of records to retrieve in a single request.
  For example, when retrievalSize is set to 30, offset is 20, and ingestionTime is 1725519793, the API request will fetch 30 records starting from the 21st record after the specified `ingestionTime`.
  Minimum value is 1 and maximum value is 200.
  """
  retrievalSize: Int
}

"""Time range for which the data should be retrieved."""
input callGroup_input_timeFrame {
  """
  Use the world_time_api tool to get the current time in epoch.
  end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.
  """
  to: BigInt

  """windowSize in milliseconds"""
  windowSize: BigInt
}

enum callGroup_input_order_direction {
  ASC
  DESC
}

input ApplicationFilter {
  label: NameFilter
  boundaryScope: BoundaryScopeFilter! = { eq: ALL }
  timeFrame: TimeFrame!
}

input BoundaryScopeFilter {
  eq: BoundaryScope!
}

"""
Filter for application scope, i.e: INBOUND or ALL
"""
enum BoundaryScope {
  ALL
  INBOUND
}

"""
Application Perspectives.
""" # originally query_getTrace_rootSpan_destination_applications_items
type ApplicationPerspective implements Entity {
  """
  Here, `ALL` Application Boundary Scope is considered.
  """
  boundaryScope: BoundaryScope!
  entityType: EntityType

  """
  Unique ID of the Application Perspective. Eg: `Av62RoIKQv-A3n6DbMQh9g`.
  """
  id: ID!

  """
  Name of the Application Perspective. Eg: `app1`.
  """
  label: String!

  to: String!
  windowSize: String!
}

type ApplicationConnection {
  edges: [ApplicationEdge]
  pageInfo: PageInfo!
}

type ApplicationEdge {
  node: ApplicationPerspective
  cursor: String
}
