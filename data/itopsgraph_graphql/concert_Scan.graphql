"""Scan information for a vulnerability"""
type Scan {
  """Scan type"""
  scan_type: String
  """Scan systems that performed the scan"""
  scan_systems: [String]
  """Scan object ID"""
  scan_object_id: String
  """Scan object name"""
  scan_object_name: String
  """Scan object attribute 1"""
  scan_object_attr1: String
  """Scan object attribute 2"""
  scan_object_attr2: String
  """Scan object attribute 3"""
  scan_object_attr3: String
  """Created timestamp"""
  created_on: Int
  """Updated timestamp"""
  updated_on: Int
  """Whether the scan is archived"""
  is_archived: Boolean
}