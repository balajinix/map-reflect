  "ID of the build artifact"
  id: String
  "Name of the artifact"
  name: String
  "Tag of the artifact"
  tag: String
  "Type of the artifact"
  type: String
}

enum concert_ComponentType {
  ""
  image
  ""
  source_repo
}

enum concert_AssessmentState {
  ""
  mitigated
  ""
  unassessed
  ""
  assessment_in_progress
  ""
  false_positive
  ""
  exception_requested
  ""
  exception_approved
  ""
  mitigation_in_progress
}

