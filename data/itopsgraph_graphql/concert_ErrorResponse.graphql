"""Error response details"""
type ErrorResponse {
  """Trace ID"""
  trace: String
  """Error message"""
  message: String
  """Exception information"""
  exception: String
  """Message code"""
  message_code: String
  """More information URL"""
  more_info: String
  """HTTP status code"""
  status_code: Int
  """Array of errors"""
  errors: [Error]
}