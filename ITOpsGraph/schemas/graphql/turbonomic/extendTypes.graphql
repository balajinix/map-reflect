# seperate from core type definition for clarity
extend type Entity {
  """
  allow entity to access its actions
  """
  actions(
    cursor: String
    limit: Int
    order_by: OrderBy
    ascending: Boolean
  ): [Action]
    @materializer(
      query: "entityActions"
      arguments: [
        { name: "entity_uuid", field: "uuid" }
        { name: "cursor", argument: "cursor" }
        { name: "limit", argument: "limit" }
        { name: "order_by", argument: "order_by" }
        { name: "ascending", argument: "ascending" }
      ]
    )

   stats: [Statistics]
   @materializer( query: "entityStats" 
      arguments: [
        { name: "entity_uuid", field: "uuid" }
        ])
}
