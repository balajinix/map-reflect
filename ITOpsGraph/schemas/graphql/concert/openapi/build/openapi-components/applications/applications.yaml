          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Get vulnerabilities summary for an application
      tags:
        - Application definitions
      x-ibm-events:
        description: API execution event
        event:
          - name: coreapi.application.get
          - description: Get API call to fetch the application
      x-ibm-permissions:
        actions:
          - name: coreapi.application.get
  /applications/{application_id}/applications_summary:
