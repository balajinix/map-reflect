type Query {
  # Get a list of Users
  getUsers(uuid: String, displayName: String, className: String, username: String, password: String, roles: [String], loginProvider: String, type: String, scope: String, atdScope: String, features: String, authToken: String, showSharedUserSC: String): [Getusers]

  # Create a new User
  createUser(uuid: String, displayName: String, className: String, username: String, password: String, roles: [Role], loginProvider: String, type: String, scope: Scope, atdScope: AtdScope, features: String, authToken: String, showSharedUserSC: String): Createuser

  # Get a User by Uuid
  getUser(uuid: String): Getuser

  # Edit an existing User
  editUser(uuid: String, displayName: String, className: String, username: String, password: String, roles: [Role], loginProvider: String, type: String, scope: Scope, atdScope: AtdScope, features: String, authToken: String, showSharedUserSC: String): Edituser

  # Delete user by uuid
  deleteUser(uuid: String): Deleteuser

  # Change password for an existing User
  changeUserPassword(uuid: String, password: String): Changeuserpassword

  # Get user preference properties by user Uuid
  getUserPreferenceProperties(uuid: String): [Getpreferencepropertiesbyuser]

  # PUT a user preference property by user Uuid
  setPreferenceProperty(uuid: String, displayName: String, className: String): Setpreferenceproperty

  # DELETE a user preference property by user Uuid
  deletePreferenceProperty(uuid: String): Deletepreferenceproperty
}
