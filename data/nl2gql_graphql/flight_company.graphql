  altitude: Float
  company_id: Int
  date: String
  id: Int!
  operate_company: Operate_company
    @materializer(query: "operate_companyUsingFlight_company_id_fkey")
  pilot: String
  vehicle_flight_number: String
  velocity: Float
}

type Operate_company {
