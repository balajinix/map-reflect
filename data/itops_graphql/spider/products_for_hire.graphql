  payment_id: ID!
  payment_type_code: String
}

type Products_booked {
  booked_amount: Float
  booked_count: ID
  booking_id: ID!
  bookings: Bookings
    @materializer(query: "bookingsUsingProducts_booked_booking_id_fkey")
  product_id: ID!
  products_for_hire: Products_for_hire
    @materializer(
      query: "products_for_hireUsingProducts_booked_product_id_fkey"
    )
  returned_late_yn: String
  returned_yn: String
}

type Products_for_hire {
  daily_hire_cost: Float
  product_description: String
  product_id: ID!
  product_name: String
  product_type_code: String
  products_booked: [Products_booked]
    @materializer(query: "products_bookedUsingProducts_booked_product_id_fkey")
  view_product_availability: [View_product_availability]
    @materializer(
      query: "view_product_availabilityUsingView_product_availability_product_id_fkey"
    )
}

type View_product_availability {
  available_yn: String
  booking_id: ID
  bookings: Bookings
