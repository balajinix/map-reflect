deployment:
  identity:
    keys:
      - algorithm: HS256
        key: STEPZEN_JWT_SECRET
configurationset:
  - configuration:
      name: instana
      apitoken: STEPZEN_INSTANA_APITOKEN
      hostname: ibmdevsandbox-instanaibm.instana.io
  - configuration:
      name: instana-guard
      apitoken: STEPZEN_INSTANA_APITOKEN
      hostname: ibmdevsandbox-instanaibm.instana.io
      stepzen.queryextensionguard: "true"
