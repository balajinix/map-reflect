"""Exposure-related statistics"""
type ExposuresInfo {
  """Total unique exposures"""
  total_unique: Int
  """Total impacted applications"""
  total_impacted_applications: Int
  """Total impacted environments"""
  total_impacted_environments: Int
  """Total impacted public access points"""
  total_impacted_public_access_points: Int
  """Priority 1 count"""
  priority_1: Int
  """Count impacting public access points"""
  impacting_public_access_points: Int
  """Count with open tickets"""
  with_open_tickets: Int
  """Count with solutions"""
  with_solutions: Int
}