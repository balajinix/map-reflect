"""the cptevents table contains a list of which current procedural terminology codes were billed for which patients."""
type mimic_CPTEVENTS {
  "costcenter is the cost center which billed for the corresponding cpt codes."
  costcenter: String
  "chartdate is the date at which the procedure occurred."
  chartdate: String
  "cpt_cd contains the original cpt code."
  cpt_cd: String
  "cpt_number is a numeric version of the cpt_cdcolumn."
  cpt_number: String
  "cpt_suffix column contains the text suffix when the cpt_cd contains non-numeric characters."
  cpt_suffix: String
  "ticket_id_seq is the order of the cpt_cd."
  ticket_id_seq: String
  "sectionheader provides a category for the given cpt code."
  sectionheader: String
  "subsectionheader provides a category for the given cpt code."
  subsectionheader: String
  "description provides information about the meaning of the cpt code."
  description: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  cpteventsList: [mimic_CPTEVENTS]
  cptevents(id: ID!): mimic_CPTEVENTS
}