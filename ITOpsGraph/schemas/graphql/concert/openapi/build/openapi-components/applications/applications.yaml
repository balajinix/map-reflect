          example: '#00AA'
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_# ]+$
          type: string
        description:
          description: Description of the tag
          example: This tag is used for development purposes.
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_. ]+$
          type: string
      required:
        - color
        - name
      type: object
    ApplicationReleaseProperties:
      description: Application release properties
      example:
        revenue: 1500.75
      properties:
        revenue:
          description: Application revenue per hour
          example: 1500.75
          format: float
          type: number
      type: object
    AppEnvironment:
      description: Environment body
      properties:
        id:
