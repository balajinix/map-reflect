"""Summary of vulnerability assessments by status"""
type VulnerabilitiesAssessmentSummary {
  """Count of unassessed vulnerabilities"""
  un_assessed: Int
  """Count of in-progress assessments"""
  in_progress: Int
  """Count of false positives"""
  false_positive: Int
  """Count of exception requests"""
  exception_requested: Int
  """Count of approved exceptions"""
  exception_approved: Int
  """Count of fixes in progress"""
  fix_in_progress: Int
  """Count of closed vulnerabilities"""
  closed: Int
}