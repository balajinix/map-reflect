query Topology {
  topology(includeData: true) {
    nodes {
      id
      label
      plugin
      entityId {
        host
        pluginId
        steadyId
      }
      data
    }
    edges {
      source
      destination
      relation
    }
  }
}

query Entities($input: entities_request_Input) {
  entities(input: $input) {
    totalHits
    canLoadMore
    adjustedTimeframe {
      to
      windowSize
    }
    items {
      label
      snapshotId
      time
      metrics
      tags
      entityHealthInfo {
        maxSeverity
        openIssues {
          id
          type
          state
          start
          end
        }
      }
    }
  }
}