extend type Query {
  """
  This endpoint retrieves entities for a given entity type along with the requested metrics.
  """
  entities(input: entities_request_Input): _entities_200_response
    @rest(
      endpoint: "https://$hostname;/api/infrastructure-monitoring/analyze/entities"
      method: POST
      headers: [
        { name: "authorization", value: "apitoken $apitoken;" }
      ]
      postbody: """
      {{.GetJSON "input"}}
      """
      configuration: "instana-guard"
    )
}

type _entities_200_response {
  adjustedTimeframe: mutation_entities_adjustedTimeframe
  canLoadMore: Boolean
  items: [mutation_entities_items_items]!
  next: JSON

  """represents the total number of results"""
  totalHits: BigInt
}

"""
Time frame provided in API request is slightly adjusted in response for faster API response.
For example, In request payload, if timeframe is 08:03 - 14:03, which is a 6 hour window size. It is adjusted to 08:05 - 14:00
Another example, In request payload, if timeframe is 08:20 - 08:20 (next day) which is a 24h window size. It is adjusted to 08:30 - 08:00 (next day)
"""
type mutation_entities_adjustedTimeframe {
  """
  end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.
  """
  to: BigInt!

  """windowSize in milliseconds"""
  windowSize: BigInt
}

type mutation_entities_items_items {
  entityHealthInfo: mutation_entities_items_items_entityHealthInfo
  label: String
  metrics: JSON
  plugin: String
  snapshotId: String
  tags: JSON

  """
  Epoch time in milliseconds if the snapshot is offline. Set to 9223372036854775807 if the snapshot is online.
  """
  time: BigInt
}

type mutation_entities_items_items_entityHealthInfo {
  maxSeverity: NonNegativeFloat
  openIssues: [mutation_entities_items_items_entityHealthInfo_openIssues_items]!
}

type mutation_entities_items_items_entityHealthInfo_openIssues_items {
  end: BigInt
  endpointServiceId: mutation_manuallyCloseEvent_endpointServiceId
  entityId: mutation_manuallyCloseEvent_entityId!
  entityType: mutation_manuallyCloseEvent_entityType
  id: mutation_manuallyCloseEvent_id!
  metadata: JSON
  metricAccessId: mutation_manuallyCloseEvent_metricAccessId
  plugin: mutation_manuallyCloseEvent_plugin!
  problem: mutation_manuallyCloseEvent_problem
  rca: JSON
  start: BigInt
  state: mutation_manuallyCloseEvent_state!
  type: mutation_manuallyCloseEvent_type!
}

input entities_request_Input {
  metrics: [mutationInput_entities_input_metrics_items_Input]
  missingPlaceholder: String
  order: mutationInput_entities_input_order_Input
  pagination: mutationInput_entities_input_pagination_Input!
  tagFilterExpression: tagFilterExpressionElement_Input!
  tags: [String]
  timeFrame: mutationInput_entities_input_timeFrame_Input!

  """Type of entities"""
  type: String
}

input mutationInput_entities_input_metrics_items_Input {
  aggregation: mutationInput_entities_input_metrics_items_aggregation!
  crossSeriesAggregation: mutationInput_entities_input_metrics_items_crossSeriesAggregation

  """
  * If granularity is not specified an aggregated value for the selected timeframe is returned.
     * If granularity is specified data points are returned with the specified granularity
      * The granularity should not be greater than the `windowSize` (important: `windowSize` is expressed in milliseconds)
      * The granularity should not be set too small relative to the `windowSize` to avoid creating an excessively large number of data points (max 600)
  """
  granularity: BigInt
  metric: String!
  regex: Boolean

  """When true, metric must be present with values"""
  required: Boolean
}

enum mutationInput_entities_input_metrics_items_aggregation {
  SUM
  MEAN
  MAX
  MIN
  P25
  P50
  P75
  P90
  P95
  P98
  P99
  P99_9
  P99_99
  DISTINCT_COUNT
  SUM_POSITIVE
  PER_SECOND
  INCREASE
}

enum mutationInput_entities_input_metrics_items_crossSeriesAggregation {
  SUM
  MEAN
  MAX
  MIN
  P25
  P50
  P75
  P90
  P95
  P98
  P99
  P99_9
  P99_99
  DISTINCT_COUNT
  SUM_POSITIVE
  PER_SECOND
  INCREASE
}

"""
Specifies the ordering of the results.
It contains fields that define the sorting criteria, the collation for sorting, and the direction in which the results should be ordered.
"""
input mutationInput_entities_input_order_Input {
  """
  If the granularity is set to `1` you can use the metric name eg. `latency.p95` to order by that value.
  """
  by: String!

  """Language code used for sorting. Ignored for infrastructure queries."""
  collation: String
  direction: queryInput_getCallGroup_input_order_direction!
}

input mutationInput_entities_input_pagination_Input {
  cursor: JSON

  """number of values to return"""
  retrievalSize: Int
}

"""
Boolean expression of tag filters to define the scope of relevant calls.
"""
input mutationInput_entities_input_tagFilterExpression_Input {
  type: String!
}

"""Time range for which the data should be retrieved."""
input mutationInput_entities_input_timeFrame_Input {
  """
  end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.
  """
  to: BigInt

  """windowSize in milliseconds"""
  windowSize: BigInt
}

"""
The order in which results will be sorted, either `ASC` for ascending or `DESC` for descending.
"""
enum queryInput_getCallGroup_input_order_direction {
  ASC
  DESC
}
