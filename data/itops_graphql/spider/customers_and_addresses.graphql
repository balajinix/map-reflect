type Addresses {
  address_content: String
  address_id: ID!
  city: String
  country: String
  customer_addresses: [Customer_addresses]
    @materializer(
      query: "customer_addressesUsingCustomer_addresses_address_id_fkey"
    )
  other_address_details: String
  state_province_county: String
  zip_postcode: String
}

type Customer_addresses {
  address_id: ID
  address_type: String
  addresses: Addresses
    @materializer(query: "addressesUsingCustomer_addresses_address_id_fkey")
  customer_id: ID
  customers: Customers
    @materializer(query: "customersUsingCustomer_addresses_customer_id_fkey")
  date_address_from: DateTime
  date_address_to: DateTime
}

type Customer_contact_channels {
  active_from_date: DateTime
  active_to_date: DateTime
  channel_code: String
  contact_number: String
  customer_id: ID
  customers: Customers
    @materializer(
      query: "customersUsingCustomer_contact_channels_customer_id_fkey"
    )
}

type Customer_orders {
  customer_id: ID
  customers: Customers
    @materializer(query: "customersUsingCustomer_orders_customer_id_fkey")
  order_date: DateTime
  order_details: String
  order_id: ID!
  order_items: [Order_items] @materializer(query: "order_items")
  order_status: String
}

type Customers {
  customer_addresses: [Customer_addresses]
    @materializer(query: "customer_addresses")
  customer_contact_channels: [Customer_contact_channels]
    @materializer(query: "customer_contact_channels")
  customer_id: ID!
  customer_name: String
  customer_orders: [Customer_orders]
    @materializer(query: "customer_ordersUsingCustomer_orders_customer_id_fkey")
  date_became_customer: DateTime
  other_customer_details: String
  payment_method: String
}

type Order_items {
  customer_orders: Customer_orders
    @materializer(query: "customer_ordersUsingOrder_items_order_id_fkey")
  order_id: ID
  order_quantity: String
  product_id: ID
  products: Products
    @materializer(query: "productsUsingOrder_items_product_id_fkey")
}

type Products {
  order_items: [Order_items]
    @materializer(query: "order_itemsUsingOrder_items_product_id_fkey")
  product_details: String
  product_id: ID!
}

