  # Create a new schedule
  addSchedule(input: AddScheduleInput!): AddSchedule! @rest(table: "Addschedule")

  # Get a specified schedule
  getSchedule(uuid: String!): GetSchedule @rest(table: "Getschedule")

  # Edit a schedule (completely replacing all fields)
  editSchedule(uuid: String!, input: EditScheduleInput!): EditSchedule! @rest(table: "Editschedule")

  # Delete a specified schedule
  deleteSchedule(uuid: String!): DeleteSchedule @rest(table: "Deleteschedule")

  # Get a list of actions that will be executed during the next schedule window
  getActionsToBeExecutedInSchedule: [GetActionsToBeExecutedInSchedule!]! @rest(table: "Getactionstobeexecutedinschedule")

  # Get the policies that use a schedule
  getPoliciesUsingTheSchedule: [GetPoliciesUsingTheSchedule!]! @rest(table: "Getpoliciesusingtheschedule")
}

