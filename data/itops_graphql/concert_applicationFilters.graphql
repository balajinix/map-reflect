enum concert_FilterValueType {
  ""
  boolean
  ""
  string
  ""
  object
}

type concert_FiltersValues {
  "Key should be list API parameter name"
  filter_key: String!
  "Possible values of filter"
  filter_values: [concert_FilterInfo!]!
  "Label be translated string which is shown in UI"
