  networkRisk: Int
  nodeType: String
  persistentStorageAdded: Boolean
  preferenceOrder: Int
  previousGenTarget: Boolean
  risk: Int
  sameFamily: Boolean
  sameMemory: Boolean
  savings: Float
  savingsPct: Int
  unitPrice: Float
}

type apptio_TagMappingsEntry {
  tag: String
  tagName: String
  vendorTagValue: String
}

