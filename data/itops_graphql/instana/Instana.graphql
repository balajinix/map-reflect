# """
# The Gethealthstate type represents the health state of an entity.
# """
type Gethealthstate {
  """
  The ID of the entity.
  """
  id: ID!

  """
  The name of the entity.
  """
  name: String!

  """
  The health state of the entity.
  """
  healthState: String!
}

# """
# The Getallusage type represents the usage data for all entities.
# """
type Getallusage {
  """
  The total usage data for all entities.
  """
  totalUsage: Float!

  """
  The list of entities and their respective usage data.
  """
  entities: [EntityUsage!]!
}

# """
# The EntityUsage type represents the usage data for a single entity.
# """
type EntityUsage {
  """
  The ID of the entity.
  """
  id: ID!

  """
  The name of the entity.
  """
  name: String!

  """
  The usage data for the entity.
  """
  usage: Float!
}

# """
# The Getusageperday type represents the usage data per day for a specific entity.
# """
type Getusageperday {
  """
  The date for which the usage data is provided.
  """
  date: String!

  """
  The usage data for the entity on the specified date.
  """
  usage: Float!
}

# """
# The Getusagepermonth type represents the usage data per month for a specific entity.
# """
type Getusagepermonth {
  """
  The month and year for which the usage data is provided.
  """
  date: String!

  """
  The usage data for the entity on the specified month.
  """
  usage: Float!
}

# """
# The Gethostsperday type represents the number of hosts per day for a specific entity.
# """
type Gethostsperday {
  """
  The date for which the host data is provided.
  """
  date: String!

  """
  The number of hosts for the entity on the specified date.
  """
  hosts: Int!
}

# """
# The Gethostspermonth type represents the number of hosts per month for a specific entity.
# """
type Gethostspermonth {
  """
  The month and year for which the host data is provided.
  """
  date: String!

  """
  The number of hosts for the entity on the specified month.
  """
  hosts: Int!
}

# """
# The Getversion type represents the version information of the Instana agent.
# """
type Getversion {
  """
  The version number of the Instana agent.
  """
  version: String!

  """
  The build number of the Instana agent.
  """
  build: Int!
}

type Query {
  """
  Fetches the health state of all entities.
  """
  getHealthState: [Gethealthstate] @rest(tableName: "Gethealthstate", description: "The returned JSON object will provide a health property which contains a simple traffic light (GREEN/YELLO/RED). For any non-Green-state a list of reasons will be provided in the messages array.\n\nPossible messages:\n* No data being processed\n* No data arriving from agents")

  """
  Fetches the total API usage and usage data for all entities.
  """
  getAllUsage: Getallusage @rest(tableName: "Getallusage", description: "API usage by customer")

  """
  Fetches the API usage data for a specific entity on a given date.
  """
  getUsagePerDay(date: String!): Getusageperday @rest(tableName: "Getusageperday", description: "API usage day / month / year")

  """
  Fetches the API usage data for a specific entity on a given month and year.
  """
  getUsagePerMonth(date: String!): Getusagepermonth @rest(tableName: "Getusagepermonth", description: "API usage month / year")

  """
  Fetches the number of hosts for a specific entity on a given date.
  """
  getHostsPerDay(date: String!): Gethostsperday @rest(tableName: "Gethostsperday", description: "Host count day / month / year")

  """
  Fetches the number of hosts for a specific entity on a given month and year.
  """
  getHostsPerMonth(date: String!): Gethostspermonth @rest(tableName: "Gethostspermonth", description: "Host count month / year")

  """
  Fetches the version information of the Instana agent.
  """
  getVersion: Getversion @rest(tableName: "Getversion", description: "API version information")
}
