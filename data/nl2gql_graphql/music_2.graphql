    @materializer(query: "performanceUsingPerformance_songid_fkey")
  songid: ID!
  title: String
  tracklists: [Tracklists]
    @materializer(query: "tracklistsUsingTracklists_songid_fkey")
  vocals: [Vocals] @materializer(query: "vocalsUsingVocals_songid_fkey")
}

type Tracklists {
  albumid: ID!
  albums: Albums @materializer(query: "albumsUsingTracklists_albumid_fkey")
  position: ID!
  songid: ID
  songs: Songs @materializer(query: "songsUsingTracklists_songid_fkey")
}

type Vocals {
  band: Band @materializer(query: "bandUsingVocals_bandmate_fkey")
  bandmate: ID!
  songid: ID!
  songs: Songs @materializer(query: "songsUsingVocals_songid_fkey")
