"""Model is an envelope that contains all the domain models that Infragraph supports."""
type Model {
  aws_ec2_instance: AwsEc2Instance!
  azure_virtual_machine: AzureVirtualMachine!
  gcp_compute_instance: GcpComputeInstance!
  packer_bucket: PackerBucket!
  aws_subnet: AwsSubnet!
  aws_vpc: AwsVpc!
  aws_ecs_cluster: AwsEcsCluster!
  aws_ecs_service: AwsEcsService!
  packer_registry: PackerRegistry!
  aws_availability_zone: AwsAvailabilityZone!
  aws_region: AwsRegion!
  aws_iam_policy: AwsIamPolicy!
  aws_iam_user: AwsIamUser!
  aws_ami: AwsAmi!
  packer_version: PackerVersion!
  aws_security_group: AwsSecurityGroup!
  aws_security_group_rule: AwsSecurityGroupRule!
  packer_sbom: PackerSbom!
  packer_build: PackerBuild!
  packer_channel: PackerChannel!
  packer_artifact: PackerArtifact!
  aws_s3_bucket: AwsS3Bucket!
  aws_ec2_volume: AwsEc2Volume!
  aws_lambda_function: AwsLambdaFunction!
  packer_inherited_revocation: PackerInheritedRevocation!
  packer_ancestry: PackerAncestry!
  aws_account: AwsAccount!
  aws_network_interface: AwsNetworkInterface!
  aws_ec2_instance_type: AwsEc2InstanceType!
  hcp_organization: HcpOrganization!
  hcp_project: HcpProject!
  hcp_terraform_workspace: HcpTerraformWorkspace!
  hcp_terraform_state_version: HcpTerraformStateVersion!
  hcp_terraform_organization: HcpTerraformOrganization!
  hcp_terraform_project: HcpTerraformProject!
  hcp_terraform_agent_pool: HcpTerraformAgentPool!
  hcp_terraform_run: HcpTerraformRun!
  aws_iam_role: AwsIamRole!
  aws_iam_role_policy_attachment: AwsIamRolePolicyAttachment!
}