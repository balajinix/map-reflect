"""d_icd_procedures defines international classification of diseases version 9 (icd-9) codes for procedures."""
type mimic_D_ICD_PROCEDURES {
  "short_title provides a brief definition for the given diagnosis code in icd9_code."
  short_title: String
  "long_title provides a brief definition for the given diagnosis code in icd9_code."
  long_title: String
  "a unique id for all mimic tables."
  mimic_id: String
  "this is a fixed length character field, as whitespaces are important in uniquely identifying icd-9 codes."
  icd9_code: String
}

type Query {
  d_icd_proceduresList: [mimic_D_ICD_PROCEDURES]
  d_icd_procedures(id: ID!): mimic_D_ICD_PROCEDURES
}