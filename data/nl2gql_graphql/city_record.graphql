type City {
  city: String
  city_id: Int
  gdp: Float
  hanyu_pinyin: String
  hanzi: String
  regional_population: Int
  temperature: Temperature @materializer(query: "temperature")
}

type Hosting_city {
  host_city: String
  match: Match @materializer(query: "match")
  match_id: Int
  year: Int
}

type Match {
  competition: String
  date: String
  hosting_city: [Hosting_city] @materializer(query: "hosting_city")
  match_id: Int
  result: String
  score: String
  venue: String
}

type Temperature {
  apr: Float
  aug: Float
  city: City @materializer(query: "city")
  city_id: Int
  dec: Float
  feb: Float
  jan: Float
  jul: Float
  jun: Float
  mar: Float
  nov: Float
  oct: Float
  sep: Float
}

