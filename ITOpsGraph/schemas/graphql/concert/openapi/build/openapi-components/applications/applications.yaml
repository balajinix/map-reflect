openapi: 3.0.0
info:
  title: API documentation for IBM Concert
  version: 0.0.1
servers:
  - url: '{server}/core/api/v1'
    variables:
      server:
        default: https://exampleHost.com
tags:
  - description: Authenticate API
    name: Access management
  - description: Operations for applications
    name: Application definitions
  - description: Automation rules API
    name: Automation rules & ticketing
  - description: Certificates API
    name: Certificates
  - description: ConcertDef SBOMs API
    name: ConcertDef SBOMs
  - description: credentials API
    name: Connections
  - description: Concert Workflows API
    name: concert_workflows
  - description: Entity Access users API
    name: Entity management
  - description: API operations for accessing environments
    name: Environment definitions
  - description: Datastore API
    name: Evidence store
  - description: Export and download API
    name: Export data
  - description: Handlers API
    name: Handlers
  - description: API operations for accessing ingestion jobs
    name: Ingestion jobs
  - description: Instance Settings API
    name: Instance settings
  - description: Inventory API
    name: Inventory
  - description: Software composition API
    name: Software composition
  - description: Vulnerabilities API
    name: Vulnerabilities
  - description: User Preferences API
    name: User preferences
  - description: Tags API
    name: Tags
  - description: instance config
    name: instance_config
  - description: Instrumentation API
    name: instrumentation
  - description: Ready API
    name: ready
  - description: Topology API
    name: topology
paths:
  /applications:
    get:
      description: Returns a list of all application definitions in your Concert instance. Note that you will only see application IDs to which you have view access.
      operationId: list_all_applications
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: Maximum number of records or items to return in the response
          in: query
          name: page_size
          required: false
          schema:
            description: Page size
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
        - description: Number of records to skip from the beginning of the data set, indicating the starting index of records to return in the response. For example, if you set the value to 10, the response will begin with the 11th record in the dataset.
          in: query
          name: page_number
          required: false
          schema:
            description: Page number
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
        - description: sort by a column
          in: query
          name: sort_by
          required: false
          schema:
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: sorting direction - no value or ascending(asc) or descending (desc)
          in: query
          name: sort_direction
          required: false
          schema:
            enum:
              - asc
              - desc
            example: desc
            maxLength: 5
            minLength: 4
            pattern: ^(asc|desc)$
            type: string
        - description: filter can consist of multiple values for the same field seprated by comma (treated as OR). filter can also be combination of multiple fields using &( treated as AND). For example - filter=column-name1:value1,value2&filter=column-name2:value1
          in: query
          name: filter
          required: false
          schema:
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: search application name
          in: query
          name: search
          required: false
          schema:
            maxLength: 250
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCollection'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: List all application definitions
      tags:
        - Application definitions
      x-ibm-events:
        description: API execution event
        event:
          - name: coreapi.application.list
          - description: Get API call to fetch the application
      x-ibm-permissions:
        actions:
          - name: coreapi.application.list
    post:
      description: Creates an new application definition from the ingested components.
      operationId: create_applications
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPrototype'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. The resource already exists.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Define an application
      tags:
        - Application definitions
      x-ibm-events:
        description: create applications
        event:
          - name: coreapi.applications.create
          - description: Creates an application definition.
      x-ibm-permissions:
        actions:
          - name: coreapi.applications.create
  /applications/{application_id}:
    delete:
      description: Deletes the application definition specified the URL path by its unique ID or name.
      operationId: delete_application
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: Unique identifier of the application definition, can be both ID/name
          in: path
          name: application_id
          required: true
          schema:
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: Resets all associations when set to true
          in: query
          name: remove_associations
          required: false
          schema:
            description: resets all associations when set to true
            type: boolean
        - description: Value should be set to "true" if all the release versions of an application must be deleted.
          in: query
          name: delete_all_versions
          schema:
            example: true
            type: boolean
        - description: Value should be set to "true" for cascade delete.
          in: query
          name: is_cascade_delete
          schema:
            example: true
            type: boolean
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Delete an application definition
      tags:
        - Application definitions
      x-ibm-events:
        description: Application Delete API execution event
        event:
          - name: coreapi.application.delete
          - description: Delete API call to delete the application
      x-ibm-permissions:
        actions:
          - name: coreapi.application.delete
    get:
      description: Returns details about the application definition specified in the URL path by its unique ID or name.
      operationId: get_application_details
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: Unique identifier of the application definition, can be both ID/name
          in: path
          name: application_id
          required: true
          schema:
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: Resets all associations when set to true
          in: query
          name: remove_associations
          required: false
          schema:
            description: resets all associations when set to true
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: View application definition details
      tags:
        - Application definitions
      x-ibm-events:
        description: API execution event
        event:
          - name: coreapi.application.get
          - description: Get API call to fetch the application
      x-ibm-permissions:
        actions:
          - name: coreapi.application.get
    patch:
      description: Modifies the application definition specifieed in the URL path by its unique application ID or name.
      operationId: update_applications
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: Unique identifier of the application definition, can be both ID/name
          in: path
          name: application_id
          required: true
          schema:
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: Resets all associations when set to true
          in: query
          name: remove_associations
          required: false
          schema:
            description: resets all associations when set to true
            type: boolean
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. The resource already exists.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Edit application definition
      tags:
        - Application definitions
      x-ibm-events:
        description: patch applications
        event:
          - name: coreapi.applications.patch
          - description: patch API call to patch applications
      x-ibm-permissions:
        actions:
          - name: coreapi.applications.patch
  /applications/{application_id}/vulnerability_details:
    get:
      description: Returns vulnerabilities impacting the application specified in the URL path by its unique application definition ID or name.
      operationId: list_applications_vulnerability_details
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: This can be either the application name or the unique UUID of the application definition.
          in: path
          name: application_id
          required: true
          schema:
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: Application release version
          in: query
          name: release_version
          required: false
          schema:
            description: Page size
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_.]+$
            type: string
        - description: Maximum number of records or items to return in the response
          in: query
          name: page_size
          required: false
          schema:
            description: Page size
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
        - description: Number of records to skip from the beginning of the data set, indicating the starting index of records to return in the response. For example, if you set the value to 10, the response will begin with the 11th record in the dataset.
          in: query
          name: page_number
          required: false
          schema:
            description: Page number
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilityDetailsCollection'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: View vulnerabilities impacting an application
      tags:
        - Application definitions
      x-ibm-events:
        description: API execution event
        event:
          - name: coreapi.applications_vulnerability_details.list
          - description: list API call to fetch the  application vulnerability details
      x-ibm-permissions:
        actions:
          - name: coreapi.applications_vulnerability_details.list
  /applications/{application_id}/vulnerabilities:
    get:
      description: Get vulnerabilities in an application
      operationId: list_application_vulnerabilities
      parameters:
        - description: Unique ID of your Concert instance
          in: header
          name: InstanceId
          required: true
          schema:
            example: 0000-0000-0000-0000
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: This can be either the application name or the unique UUID of the application definition.
          in: path
          name: application_id
          required: true
          schema:
            example: f465178a-469b-432f-a6e8-5b638e86c183
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_]+$
            type: string
        - description: Application release version
          in: query
          name: release_version
          required: false
          schema:
            description: Page size
            example: 1.0.0
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9\-_.]+$
            type: string
        - description: Severity
          in: query
          name: severity
          required: false
          schema:
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: Maximum number of records or items to return in the response
          in: query
          name: page_size
          required: false
          schema:
            description: Page size
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
        - description: offset
          in: query
          name: page_number
          required: false
          schema:
            description: Page number
            format: int32
            maximum: 2000
            minimum: 0
            type: integer
        - description: sort by a column
          in: query
          name: sort_by
          required: false
          schema:
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: sorting direction - no value or ascending(asc) or descending (desc)
          in: query
          name: sort_direction
          required: false
          schema:
            enum:
              - asc
              - desc
            example: desc
            maxLength: 5
            minLength: 4
            pattern: ^(asc|desc)$
            type: string
        - description: filter can consist of multiple values for the same field seprated by comma (treated as OR). filter can also be combination of multiple fields using &( treated as AND). For example - filter=column-name1:value1,value2&filter=column-name2:value1
          in: query
          name: filter
          required: false
          schema:
            maxLength: 1000
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
        - description: search cve name
          in: query
          name: search
          required: false
          schema:
            maxLength: 250
            minLength: 0
            pattern: ^[a-zA-Z0-9\-]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilityCollection'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Get vulnerabilities in an application
      tags:
        - Application definitions
      x-ibm-events:
        description: API execution event
        event:
          - name: coreapi.application_vulnerabilities.list
          - description: Get API call to fetch the application
      x-ibm-permissions:
        actions:
          - name: coreapi.application_vulnerabilities.list
