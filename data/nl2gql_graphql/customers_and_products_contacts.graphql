      query: "customer_address_historyUsingCustomer_address_history_address_id_fkey"
    )
  line_1_number_building: String
  state_province_county: String
  zip_postcode: String
}

type Contacts {
  contact_id: ID!
  contact_phone: String
  customer_id: ID
  first_name: String
  gender: String
  last_name: String
}

type Customer_address_history {
  address_id: ID
  addresses: Addresses
    @materializer(
      query: "addressesUsingCustomer_address_history_address_id_fkey"
    )
  customer_id: ID
  customers: Customers
    @materializer(
      query: "customersUsingCustomer_address_history_customer_id_fkey"
    )
  date_from: DateTime
  date_to: DateTime
}

type Customer_orders {
  customer_id: ID
  customers: Customers
    @materializer(query: "customersUsingCustomer_orders_customer_id_fkey")
  order_date: DateTime
  order_id: ID!
  order_items: [Order_items] @materializer(query: "order_items")
  order_status_code: String
}

type Customers {
  customer_address: String
  customer_address_history: [Customer_address_history]
    @materializer(query: "customer_address_history")
  customer_email: String
  customer_id: ID!
  customer_name: String
  customer_number: String
  customer_orders: [Customer_orders]
    @materializer(query: "customer_ordersUsingCustomer_orders_customer_id_fkey")
  customer_phone: String
  payment_method_code: String
}

type Order_items {
  customer_orders: Customer_orders
    @materializer(query: "customer_ordersUsingOrder_items_order_id_fkey")
  order_id: ID
  order_item_id: ID
  order_quantity: String
  product_id: ID
  products: Products
    @materializer(query: "productsUsingOrder_items_product_id_fkey")
}

type Products {
  order_items: [Order_items]
    @materializer(query: "order_itemsUsingOrder_items_product_id_fkey")
  product_id: ID!
  product_name: String
  product_price: Float
  product_type_code: String
}

