enum concert_SortDirection {
  "Sort in ascending order"
  asc
  "Sort in descending order"
  desc
}

type concert_PackageDetailsCollection {
  "List of packages"
  packages: [concert_PackageDetailsSummary!]!
}

type concert_PackageDetailsSummary {
  "Score of package"
  avg_score: Float
  "Backlevel of package"
  backlevel: String!
  "Check level info for a package"
  checks: [concert_Checks!]!
  "Array of CVEs for a package"
  cves: [concert_CveInfo!]!
  "Package default published at"
  default_published_at: String
  "Default version of package"
  default_version: String
  "Description of package"
  description: String
  "Package ID"
  id: String
  "Package last updated by"
  last_updated_by: String
  "Package last updated time"
  last_updated_on: Int
  "Package latest published at"
  latest_published_at: String
  "Latest version of package"
  latest_version: String
  "License status of the package"
  license_status: String
  "License of the package"
  licenses: [concert_LicenseStatus!]!
  "Score of package"
  min_score: Int
  "Name of the package"
  name: String!
  "ossrepo of package"
  ossrepo: String
  "Package was published at"
  published_at: String
  "Recommendation"
  recommendation: concert_PackageRecommendation!
  "References"
  references: concert_PackageReferences!
  "Registry / ecosystem of package"
  registry: String
  "Source URL of the package"
  source_url: String
  "Stat of package"
  stat: String
  "Tags of the package"
  tags: [String!]!
  "Version of the package"
  version: String!
  "Vulnerability count of package"
  vulnerability_count: Int!
}

type concert_Checks {
  "Check Category of package"
  category: String
  "ckname of package"
  ckname: String
  "Check Reason of package"
  reason: String
  "Check Score of package"
  score: Int
}

type concert_CveInfo {
  "CVE"
  cve: String
  "Represents if there are any findings of the CVE"
  exists_in_vulnerabilities: Boolean!
}

type concert_LicenseStatus {
  "License Name/Id"
  id: String!
  "License Status"
  status: String!
}

type concert_PackageRecommendation {
  "Action to perform"
  action: String
  "Recommendation created date"
  created_date: Int
  "Recommendation Description"
  description: String
  "Recommendation for action"
  recommendation: String
  "Recommendation ID"
  recommendation_id: String
  "Type of the risk"
  risk_type: String
}

type concert_PackageReferences {
  "Total count of images related to a package"
  images_count: Int!
  "Total count of libraries related to a package"
  libraries_count: Int!
  "Total count of repositories related to a package"
  repositories_count: Int!
}

type Query {
  concert_applicationPackages(
    application_id: String!
    filter: String
    page_number: Int
    page_size: Int
    release_version: String
    search: String
    sort_by: String
    sort_direction: concert_SortDirection
    token: Secret
  ): concert_PackageDetailsCollection
    @graphql(
      endpoint: "https://watzen.us-east-a.ibm.stepzen.net/solis-dal/federated-all/graphql"
      headers: [
        {
          name: "authorization"
          value: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NDM2MDcyMzMsImV4cCI6MTc1MTQ5MTIzM30.8ltkpyvXktHBFf5zVuslZ1s0WH1znqluUnOEmRdV1Xs"
        }
      ]
    )
}
