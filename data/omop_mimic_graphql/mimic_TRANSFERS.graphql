"""transfers are physical locations for patients throughout their hospital stay."""
type mimic_TRANSFERS {
  "dbsource contains the original icu database the data was sourced from."
  dbsource: String
  "eventtype describes what transfer event occurred."
  eventtype: String
  "prev_careunit contains the care unit in which the patient previously resided."
  prev_careunit: String
  "curr_careunit contains the care unit in which the patient currently resides."
  curr_careunit: String
  "prev_wardid contains the previous ward in which the patient stayed."
  prev_wardid: String
  "curr_wardid contains the current ward in which the patient stayed."
  curr_wardid: String
  "intime provides the date and time the patient was transferred into the current care unit from the previous care unit."
  intime: String
  "outtime provides the date and time the patient was transferred out of the current care unit."
  outtime: String
  "los is the length of stay for the patient for the given ward stay, which may be within or outside of the icu."
  los: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  transfersList: [mimic_TRANSFERS]
  transfers(id: ID!): mimic_TRANSFERS
}