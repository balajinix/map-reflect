"""prescriptions contains medication related order entries."""
type mimic_PRESCRIPTIONS {
  "date when the prescription started."
  startdate: String
  "date when the prescription ended."
  enddate: String
  "drug_type provides the type of drug prescribed."
  drug_type: String
  "drug is various representation of the drug prescribed to the patient."
  drug: String
  "drug_name_poe is various representation of the drug prescribed to the patient."
  drug_name_poe: String
  "drug_name_generic is various representation of the drug prescribed to the patient."
  drug_name_generic: String
  "formulary_drug_cd provides a representation of the drug in various coding systems."
  formulary_drug_cd: String
  "gsn is the generic sequence number."
  gsn: String
  "ndc is the national drug code"
  ndc: String
  "strength of the drug product."
  prod_strength: String
  "dose of the drug prescribed."
  dose_val_rx: String
  "unit of measurement associated with the dose."
  dose_unit_rx: String
  "amount of the formulation dispensed."
  form_val_disp: String
  "unit of measurement associated with the formulation."
  form_unit_disp: String
  "route of administration, for example intravenous or oral."
  route: String
  "a unique id for all mimic tables."
  mimic_id: String
}

type Query {
  prescriptionsList: [mimic_PRESCRIPTIONS]
  prescriptions(id: ID!): mimic_PRESCRIPTIONS
}