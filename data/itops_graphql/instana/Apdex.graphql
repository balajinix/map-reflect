# """
# The GetApdexReport type represents the structure of an Apdex report.
# """
type GetApdexReport {
  """
  The ID of the report.
  """
  id: ID!

  """
  The title of the report.
  """
  title: String!

  """
  The date the report was created.
  """
  created_at: String!

  """
  The date the report was last updated.
  """
  updated_at: String!

  """
  The Apdex score of the report.
  """
  score: Float!

  """
  The satisfaction score of the report.
  """
  satisfaction: Float!

  """
  The frustration score of the report.
  """
  frustration: Float!

  """
  The number of requests in the report.
  """
  request_count: Int!

  """
  The number of successful requests in the report.
  """
  success_count: Int!

  """
  The number of failed requests in the report.
  """
  failure_count: Int!

  """
  The number of slow requests in the report.
  """
  slow_count: Int!

  """
  The number of very slow requests in the report.
  """
  very_slow_count: Int!
}

# Here is the GraphQL Query type with fields mapped to the provided REST endpoint:

type Query {
  """
  Generate an Apdex Report for a specified Apdex ID.
  """
  apdexReport(id: ID!): GetApdexReport @rest(table: "Getapdexreport")
}

# This query, `apdexReport`, takes an `id` argument of type `ID!`. When this query is executed, it will map to the `Getapdexreport` REST endpoint to fetch the Apdex report data for the given ID. The response will be a `GetApdexReport` object containing all the fields specified in the given schema.
