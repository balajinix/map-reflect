type Issue {
  """ID of the finding"""
  id: String
  """Type of ID"""
  id_type: String
  """Time of the issue creation"""
  opened_on: Int
  """Time of the issue was fixed on"""
  fixed_on: Int
  """Comment on the issue"""
  comment: String
  """Status of the issue"""
  status: String
  """Last updated time of issue"""
  last_updated_on: Int
  """Last updated user of issue"""
  last_updated_by: String
  """Issue link"""
  issue_link: IssueLink
}