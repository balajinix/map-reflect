type Clusters {
  result: Result
}

type ClustersEntry {
  firstSeen: DateTime
  id: String
  lastSeen: DateTime
  name: String
  nodes: [NodesEntry]
  provisionedAt: DateTime
}

type ResultMeta {
  firstSeenDate: DateTime
  orgHasData: Boolean
  orgHasProvisioned: Boolean
}

type NodesEntry {
  resourceIdentifier: String
  vendor: String
}

type Result {
  clusters: [ClustersEntry]
  meta: ResultMeta
}

type Query {
  clusters(end: String, pretty: String, start: String): Clusters
    @rest(
      endpoint: "https://$hostname;/v3/containers/clusters"
      method: GET
      headers: [
        { name: "accept", value: "application/json" }
        { name: "authorization", value: "Basic $apitoken;"}
      ]
      configuration: "apptio"
    )
}
