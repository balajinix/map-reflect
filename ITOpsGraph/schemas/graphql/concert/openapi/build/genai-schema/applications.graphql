schema @sdl(files: ["applications.graphql"]) {
  query: Query
  mutation: Mutation
}

type Query {
  """
  Returns a list of all application definitions in your Concert instance. 
  Note that you will only see application IDs to which you have view access.
  """
  applications(
    """Maximum number of records or items to return in the response"""
    page_size: Int
    """Number of records to skip from the beginning of the data set"""
    page_number: Int
    """Sort by a column"""
    sort_by: String
    """Sorting direction - no value or ascending(asc) or descending (desc)"""
    sort_direction: SortDirection
    """Filter can consist of multiple values for the same field separated by comma (treated as OR)"""
    filter: String
    """Search application name"""
    search: String
  ): ApplicationCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Returns details about the application definition specified by its unique ID or name.
  """
  application(
    """Unique identifier of the application definition, can be both ID/name"""
    application_id: String!
    """Resets all associations when set to true"""
    remove_associations: Boolean
  ): Application
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Returns vulnerabilities impacting the application specified by its unique application definition ID or name.
  """
  applicationVulnerabilityDetails(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
    """Application release version"""
    release_version: String
    """Maximum number of records or items to return in the response"""
    page_size: Int
    """Number of records to skip from the beginning of the data set"""
    page_number: Int
  ): VulnerabilityDetailsCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/vulnerability_details",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get vulnerabilities in an application
  """
  applicationVulnerabilities(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
    """Application release version"""
    release_version: String
    """Severity"""
    severity: String
    """Maximum number of records or items to return in the response"""
    page_size: Int
    """Number of records to skip from the beginning of the data set"""
    page_number: Int
    """Sort by a column"""
    sort_by: String
    """Sorting direction - no value or ascending(asc) or descending (desc)"""
    sort_direction: SortDirection
    """Filter can consist of multiple values for the same field separated by comma (treated as OR)"""
    filter: String
    """Search cve name"""
    search: String
  ): VulnerabilityCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/vulnerabilities",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get vulnerabilities summary for an application
  """
  applicationVulnerabilitiesSummary(
    """Unique ID of the application definition"""
    application_id: String!
  ): VulnerabilitiesSummary
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/vulnerabilities_summary",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get application summary
  """
  applicationsSummary(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
  ): AppComponentCount
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/applications_summary",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get application revenue per hour
  """
  applicationRevenue(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
    """Release version of the application"""
    release_version: String
  ): ApplicationReleaseProperties
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/revenue",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get sboms of an application
  """
  applicationSboms(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
    """Application release version"""
    release_version: String
    """Maximum number of records or items to return in the response"""
    page_size: Int
    """Number of records to skip from the beginning of the data set"""
    page_number: Int
    """Sort by a column"""
    sort_by: String
    """Sorting direction - no value or ascending(asc) or descending (desc)"""
    sort_direction: SortDirection
    """Search application name"""
    search: String
  ): ApplicationSbomsCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/sboms",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get application packages
  """
  applicationPackages(
    """This can be either the application name or the unique UUID of the application definition"""
    application_id: String!
    """Application release version"""
    release_version: String
    """Maximum number of records or items to return in the response"""
    page_size: Int
    """Number of records to skip from the beginning of the data set"""
    page_number: Int
    """Sort by a column"""
    sort_by: String
    """Sorting direction - no value or ascending(asc) or descending (desc)"""
    sort_direction: SortDirection
    """Filter can consist of multiple values for the same field separated by comma (treated as OR)"""
    filter: String
    """Search cve name"""
    search: String
  ): PackageDetailsCollection
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id/packages",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Get all applications filters
  """
  applicationFilters: ApplicationFilters
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/application_filters",
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )
}

type Mutation {
  """
  Creates a new application definition from the ingested components.
  """
  createApplication(
    """Application schema definition"""
    application: ApplicationPrototypeInput!
  ): Application
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications",
      method: POST,
      headers: [
        { name: "InstanceId", value: "$instanceId" },
        { name: "Content-Type", value: "application/json" }
      ],
      configuration: "ibm-concert"
    )

  """
  Deletes the application definition specified by its unique ID or name.
  """
  deleteApplication(
    """Unique identifier of the application definition, can be both ID/name"""
    application_id: String!
    """Resets all associations when set to true"""
    remove_associations: Boolean
    """Value should be set to "true" if all the release versions of an application must be deleted"""
    delete_all_versions: Boolean
    """Value should be set to "true" for cascade delete"""
    is_cascade_delete: Boolean
  ): Boolean
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id",
      method: DELETE,
      headers: [
        { name: "InstanceId", value: "$instanceId" }
      ],
      configuration: "ibm-concert"
    )

  """
  Modifies the application definition specified by its unique application ID or name.
  """
  updateApplication(
    """Unique identifier of the application definition, can be both ID/name"""
    application_id: String!
    """Resets all associations when set to true"""
    remove_associations: Boolean,
    """Application patch data"""
    applicationPatch: ApplicationPatchInput!
  ): Application
    @rest(
      endpoint: "https://exampleHost.com/core/api/v1/applications/$application_id",
      method: PATCH,
      headers: [
        { name: "InstanceId", value: "$instanceId" },
        { name: "Content-Type", value: "application/merge-patch+json" }
      ],
      configuration: "ibm-concert"
    )
}

